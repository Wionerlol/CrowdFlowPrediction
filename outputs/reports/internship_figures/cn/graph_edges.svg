<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="74" font-size="48" font-weight="700" fill="#103B5C">四种边分别表达四种“相邻”</text><text x="1200" y="64" font-size="16" fill="#526372">12</text><text x="55" y="114" font-size="20" fill="#526372">共享 1,024 个节点，但 edge_index 与 edge_weight 来自完全不同的关系假设。</text></g>
 <g id="cards" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect x="55" y="150" width="555" height="215" fill="#FFFFFF" stroke="#F26A2E" stroke-width="3"/><text x="80" y="190" font-size="28" font-weight="700" fill="#103B5C">G_spatial · 地理邻接</text><text x="80" y="226" font-size="18" fill="#526372">Moore 8 邻域；正交 d=1，斜角 d=√2</text><text x="80" y="260" font-size="20" font-family="Consolas, Courier New, monospace" fill="#F26A2E">w = exp(−d² / 1.5²)</text><text x="80" y="298" font-size="18" fill="#526372">正交权重 0.641；斜角权重 0.411</text><text x="80" y="337" font-size="24" font-weight="700" fill="#103B5C">7,812 条有向边 · 7.6 / node</text>
  <rect x="670" y="150" width="555" height="215" fill="#FFFFFF" stroke="#C9D5DF"/><text x="695" y="190" font-size="28" font-weight="700" fill="#103B5C">G_poi · 功能相似</text><text x="695" y="226" font-size="18" fill="#526372">11 类 POI density → log1p → L2 normalize</text><text x="695" y="260" font-size="20" font-family="Consolas, Courier New, monospace" fill="#2A7F9E">w = cosine(poi_i, poi_j)</text><text x="695" y="298" font-size="18" fill="#526372">每节点保留 top-k=10；transport 已剥离</text><text x="695" y="337" font-size="24" font-weight="700" fill="#103B5C">10,240 条有向边 · 10.0 / node</text>
  <rect x="55" y="390" width="555" height="215" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="430" font-size="28" font-weight="700" fill="#103B5C">G_flow · 流量同步</text><text x="80" y="466" font-size="18" fill="#526372">节点 inflow 时序 Pearson correlation</text><text x="80" y="500" font-size="20" font-family="Consolas, Courier New, monospace" fill="#2A7F9E">top-k=15；仅保留 corr &gt; 0</text><text x="80" y="538" font-size="18" fill="#526372">表达非局部通勤同步，而非物理邻近</text><text x="80" y="577" font-size="24" font-weight="700" fill="#103B5C">15,255 条有向边 · 14.9 / node</text>
  <rect x="670" y="390" width="555" height="215" fill="#FFFFFF" stroke="#C9D5DF"/><text x="695" y="430" font-size="28" font-weight="700" fill="#103B5C">G_transit · 轨道拓扑</text><text x="695" y="466" font-size="18" fill="#526372">政府站点/线路与 OSM 坐标名称匹配</text><text x="695" y="500" font-size="20" font-family="Consolas, Courier New, monospace" fill="#2A7F9E">w = exp(−station_hops / 3)</text><text x="695" y="538" font-size="18" fill="#526372">同线路最多连接 10 站跳；双向边</text><text x="695" y="577" font-size="24" font-weight="700" fill="#103B5C">3,080 条有向边 · 3.0 / node</text>
 </g>
 <g id="storage" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="55" y="630" width="1170" height="52" fill="#103B5C"/><text x="80" y="663" font-size="17" fill="#FFFFFF">统一存储：edge_index (2,E) + edge_weight (E) + num_nodes；候选 G_flow 属数据派生图，最终模型未采用。</text></g>
</svg>
