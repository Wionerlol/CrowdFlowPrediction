<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C9D5DF" /></marker></defs>
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC" /></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="82" font-size="56" font-weight="700" fill="#103B5C">端到端技术路线</text><text x="1155" y="65" font-size="16" fill="#526372">05</text><text x="55" y="132" font-size="36" fill="#17212B">统一时间、空间和数据规则，使预测结果直接进入异常检测与服务。</text></g>
 <g id="connectors" stroke="#C9D5DF" stroke-width="5" marker-end="url(#arrow)"><line x1="260" y1="340" x2="300" y2="340" /><line x1="500" y1="340" x2="540" y2="340" /><line x1="740" y1="340" x2="780" y2="340" /><line x1="980" y1="340" x2="1020" y2="340" /></g>
 <g id="stages" font-family="Microsoft YaHei, Arial, sans-serif">
  <g id="s1"><rect x="60" y="220" width="200" height="260" fill="#FFFFFF" stroke="#C9D5DF" /><rect x="60" y="220" width="200" height="12" fill="#2A7F9E" /><text x="82" y="275" font-size="34" font-weight="700" fill="#103B5C">数据治理</text><text font-size="18" fill="#526372" x="82" y="326">gap-aware 窗口</text><text font-size="18" fill="#526372" x="82" y="356">时序切分 · 无泄漏</text><rect x="82" y="400" width="156" height="50" fill="#EAF0F5" /><text x="160" y="432" text-anchor="middle" font-size="18" fill="#103B5C">连续样本</text></g>
  <g id="s2"><rect x="300" y="220" width="200" height="260" fill="#FFFFFF" stroke="#C9D5DF" /><rect x="300" y="220" width="200" height="12" fill="#2A7F9E" /><text x="322" y="275" font-size="34" font-weight="700" fill="#103B5C">特征工程</text><text font-size="18" fill="#526372" x="322" y="326">流量 · 时间 · 静态</text><text font-size="18" fill="#526372" x="322" y="356">候选图结构</text><rect x="322" y="400" width="156" height="50" fill="#EAF0F5" /><text x="400" y="432" text-anchor="middle" font-size="18" fill="#103B5C">模型输入</text></g>
  <g id="s3"><rect x="540" y="220" width="200" height="260" fill="#FFFFFF" stroke="#F26A2E" stroke-width="3" /><rect x="540" y="220" width="200" height="12" fill="#F26A2E" /><text x="562" y="275" font-size="34" font-weight="700" fill="#103B5C">预测建模</text><text font-size="18" fill="#526372" x="562" y="326">基线 · AGFormer</text><text font-size="18" fill="#526372" x="562" y="356">STF · 残差 · 集成</text><rect x="562" y="400" width="156" height="50" fill="#F26A2E" /><text x="640" y="432" text-anchor="middle" font-size="18" fill="#FFFFFF">24h 预测</text></g>
  <g id="s4"><rect x="780" y="220" width="200" height="260" fill="#FFFFFF" stroke="#C9D5DF" /><rect x="780" y="220" width="200" height="12" fill="#2A7F9E" /><text x="802" y="275" font-size="34" font-weight="700" fill="#103B5C">异常检测</text><text font-size="18" fill="#526372" x="802" y="326">三路得分 · 定权</text><text font-size="18" fill="#526372" x="802" y="356">事件合并与分类</text><rect x="802" y="400" width="156" height="50" fill="#EAF0F5" /><text x="880" y="432" text-anchor="middle" font-size="18" fill="#103B5C">事件对象</text></g>
  <g id="s5"><rect x="1020" y="220" width="200" height="260" fill="#FFFFFF" stroke="#C9D5DF" /><rect x="1020" y="220" width="200" height="12" fill="#2E7D5B" /><text x="1042" y="275" font-size="34" font-weight="700" fill="#103B5C">系统落地</text><text font-size="18" fill="#526372" x="1042" y="326">Batch / Realtime</text><text font-size="18" fill="#526372" x="1042" y="356">API · 地图 · 预警</text><rect x="1042" y="400" width="156" height="50" fill="#2E7D5B" /><text x="1120" y="432" text-anchor="middle" font-size="18" fill="#FFFFFF">可用服务</text></g>
 </g>
 <g id="validation" font-family="Microsoft YaHei, Arial, sans-serif"><line x1="60" y1="548" x2="1220" y2="548" stroke="#C9D5DF" /><text x="60" y="590" font-size="18" fill="#526372">共同约束</text><text x="220" y="590" font-size="18" fill="#17212B">时间连续性</text><text x="430" y="590" font-size="18" fill="#17212B">无数据泄漏</text><text x="640" y="590" font-size="18" fill="#17212B">同窗口公平对照</text><text x="890" y="590" font-size="18" fill="#17212B">验证集选参</text><text x="1080" y="590" font-size="18" fill="#17212B">可复现输出</text></g>
</svg>