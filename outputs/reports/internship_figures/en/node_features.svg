<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="74" font-size="48" font-weight="700" fill="#103B5C">The 41-D Candidate Node Vector</text><text x="1200" y="64" font-size="16" fill="#526372">10</text><text x="55" y="114" font-size="20" fill="#526372">Every dimension has a spatial source; skewed counts use log1p before z-score or min–max scaling.</text></g>
 <g id="dimension_bar" font-family="Arial, Microsoft YaHei, sans-serif">
  <text x="55" y="165" font-size="22" font-weight="700" fill="#103B5C">Dimension map</text>
  <rect x="55" y="185" width="112" height="58" fill="#103B5C"/><text x="111" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Geo 4</text>
  <rect x="167" y="185" width="72" height="58" fill="#2A7F9E"/><text x="203" y="220" text-anchor="middle" font-size="16" fill="#FFFFFF">D 2</text>
  <rect x="239" y="185" width="140" height="58" fill="#F26A2E"/><text x="309" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Road 5</text>
  <rect x="379" y="185" width="300" height="58" fill="#103B5C"/><text x="529" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">POI density 11</text>
  <rect x="679" y="185" width="140" height="58" fill="#2E7D5B"/><text x="749" y="220" text-anchor="middle" font-size="17" fill="#FFFFFF">EO 5</text>
  <rect x="819" y="185" width="220" height="58" fill="#C97A11"/><text x="929" y="220" text-anchor="middle" font-size="17" fill="#FFFFFF">Flow stats 8</text>
  <rect x="1039" y="185" width="84" height="58" fill="#2A7F9E"/><text x="1081" y="220" text-anchor="middle" font-size="16" fill="#FFFFFF">Stops 3</text>
  <rect x="1123" y="185" width="58" height="58" fill="#103B5C"/><text x="1152" y="220" text-anchor="middle" font-size="16" fill="#FFFFFF">R 2</text>
  <rect x="1181" y="185" width="44" height="58" fill="#F26A2E"/><text x="1203" y="220" text-anchor="middle" font-size="16" fill="#FFFFFF">B1</text>
 </g>
 <g id="groups" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="55" y="275" width="365" height="245" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="312" font-size="23" font-weight="700" fill="#103B5C">Location &amp; accessibility · 11D</text><text x="80" y="350" font-size="17" fill="#526372">Geo 4: lat / lon / center distance / ring</text><text x="80" y="380" font-size="17" fill="#526372">Distance 2: nearest hub / commercial area</text><text x="80" y="410" font-size="17" fill="#526372">Road 5: all, major, local, service,</text><text x="80" y="437" font-size="17" fill="#526372">walking and cycling density</text><text x="80" y="482" font-size="16" fill="#2A7F9E">OSM clipping → UTM length / cell area</text>
  <rect x="445" y="275" width="365" height="245" fill="#FFFFFF" stroke="#C9D5DF"/><text x="470" y="312" font-size="23" font-weight="700" fill="#103B5C">Urban function &amp; cover · 16D</text><text x="470" y="350" font-size="17" fill="#526372">POI 11: food, shopping, entertainment,</text><text x="470" y="377" font-size="17" fill="#526372">office, residential, education, health,</text><text x="470" y="404" font-size="17" fill="#526372">government, tourism, sports, religion</text><text x="470" y="442" font-size="17" fill="#526372">EO 5: NDVI / NDBI / MNDWI /</text><text x="470" y="469" font-size="17" fill="#526372">red-band mean and standard deviation</text><text x="470" y="502" font-size="16" fill="#2E7D5B">Landsat reflectance → cell aggregation</text>
  <rect x="835" y="275" width="390" height="245" fill="#FFFFFF" stroke="#C9D5DF"/><text x="860" y="312" font-size="23" font-weight="700" fill="#103B5C">Flow profile &amp; transit · 14D</text><text x="860" y="350" font-size="17" fill="#526372">Flow stats 8: mean, p99, zero rate,</text><text x="860" y="377" font-size="17" fill="#526372">peak/weekend/night ratios, net flow, CV</text><text x="860" y="415" font-size="17" fill="#526372">Stop density 3: station / entrance / bus</text><text x="860" y="445" font-size="17" fill="#526372">Rail 2: line count / transfer hub</text><text x="860" y="475" font-size="17" fill="#526372">Bus 1: unique routes in the cell</text><text x="860" y="505" font-size="16" fill="#C97A11">Flow statistics were later removed for leakage</text>
 </g>
 <g id="normalization" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="548" width="1170" height="92" fill="#EAF0F5"/><text x="80" y="582" font-size="20" font-weight="700" fill="#103B5C">Scaling contract</text><text x="300" y="582" font-size="17" fill="#17212B">coordinates/distances min–max; density log1p+z; EO z-score; route counts log1p; hub flag stays binary.</text><text x="80" y="616" font-size="18" fill="#526372">Output: node_features (1,024, 41), float32, no NaNs; leakage-safe column selection occurs when the model loads it.</text></g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="684" font-size="16" fill="#526372">Transport POIs once represented 65% of POIs and collapsed semantic similarity; they were separated into dedicated transit features.</text></g>
</svg>
