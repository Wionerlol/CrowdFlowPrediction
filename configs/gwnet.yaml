model: gwnet
city:  bj
N:     1024         # 32×32 网格节点数

T_in:  48
T_out: 48

# 时序卷积
dilations:   [1, 2, 4, 8, 16, 32]   # RF = 1 + 1*(1+2+4+8+16+32) = 64
kernel_size: 2

# 隐层维度
residual_ch: 32
skip_ch:     64

# 图卷积（预定义图 ChebConv）
K:         2

# 自适应邻接矩阵嵌入维度
embed_dim: 10

# 正则化
dropout:      0.3
weight_decay: 0.0001

# 训练
batch:    16
epochs:   100
lr:       0.001
patience: 15

save_path: outputs/checkpoints/gwnet/best.pt
log_dir:   outputs/logs/gwnet
