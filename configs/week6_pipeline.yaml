output_dir: outputs/week6_pipeline
device: cuda

preprocessing:
  # Raw preprocessing is intentionally optional because TaxiBJ/NYC processed
  # artifacts are already committed/generated by Week 2. Set run=true only when
  # raw files need to be rebuilt.
  run: false
  commands:
    - [".venv/bin/python", "scripts/preprocess_all.py"]
  required_artifacts:
    - data/processed/taxibj_clean.npz
    - data/processed/taxinyc_clean.npz
    - data/processed/weather_bj_30min.csv
    - data/processed/weather_nyc_30min.csv

feature_engineering:
  # Feature engineering is represented as artifact validation by default.
  # The commands document the rebuild path but are not run unless run=true.
  run: false
  commands:
    - [".venv/bin/python", "scripts/build_temporal_features.py"]
    - [".venv/bin/python", "scripts/build_graphs.py"]
  required_artifacts:
    - data/processed/node_features_bj.npy
    - data/processed/graph_spatial_bj.pt
    - data/processed/graph_flow_bj.pt
    - data/processed/graph_poi_bj.pt
    - data/processed/graph_transit_bj.pt
    - data/processed/grid_coords_bj.npy
    - data/processed/grid_meta_bj.csv

batch:
  week5_config: configs/week5_anomaly.yaml
  alerts_config: configs/week6_alerts.yaml
  run_anomaly_detection: true
  required_week5_artifacts:
    - outputs/week5_anomaly/summary.json
    - outputs/week5_anomaly/scores.npz
    - outputs/week5_anomaly/events.csv
    - outputs/week5_anomaly/event_explainability.csv
  week5_summary: outputs/week5_anomaly/summary.json
  week5_events: outputs/week5_anomaly/events.csv

realtime:
  # Rolling micro-batch inference over selected latest test windows.
  # window_start=-24 means the latest 24 valid test windows.
  week5_config: configs/week5_anomaly.yaml
  alerts_config: configs/week6_alerts.yaml
  calibration_scores: outputs/week5_anomaly/scores.npz
  output_dir: outputs/week6_pipeline/realtime
  window_start: -24
  window_count: 24
  # Week7 performance path: 24 windows are processed in measured-safe GPU
  # micro-batches and shared by h1 anomaly detection plus the Web forecast.
  prediction_batch_size: 8
  prediction_num_workers: 0
  # The 256-window FP16 accuracy gate passed, but the final same-run latency
  # gate did not (0.995x); keep the production path on stable FP32.
  prediction_precision: fp32
  materialize_attention_weights: false
  reuse_forecast_inference: true
  # Training-only slot statistics are immutable until source data or label
  # rules change; the cache embeds a SHA256-backed fingerprint.
  statistical_cache: outputs/week6_pipeline/cache/statistical_bj_v1.npz
  # A single latest, common-origin 48-step forecast used by the Web animation.
  forecast_window_start: -1
  required_artifacts:
    - data/processed/taxibj_clean.npz
    - data/processed/node_features_bj.npy
    - outputs/week5_anomaly/checkpoints/vae.pt
    - outputs/week5_anomaly/checkpoints/transformer_ae.pt
    - outputs/week5_anomaly/scores.npz
