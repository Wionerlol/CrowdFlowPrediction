model: agformer
city:  bj
N:     1024

T_in:  48
T_out: 48

d_model:    32      # 降低（原64），减少注意力矩阵显存
n_heads:    4       # 32/4 = 8 per head
d_ff:       64      # 降低（原128）
num_layers: 2       # 降低（原3）
embed_dim:  10
dropout:    0.1

weight_decay: 0.0001
batch:        8     # 降低（原16），BN=8192，注意力矩阵约300MB
epochs:       100
lr:           0.001
patience:     15
num_workers:  2     # 限制DataLoader worker数，减少CPU内存占用

save_path: outputs/checkpoints/agformer/best.pt
log_dir:   outputs/logs/agformer
