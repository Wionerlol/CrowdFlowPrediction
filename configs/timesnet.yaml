model: timesnet
city:  bj

T_in:  48
T_out: 48

# TimesNet 超参
d_model:    64      # 隐层维度（保守，避免 OOM）
d_ff:       128     # Inception 中间维度
num_layers: 2       # TimesBlock 层数
top_k:      3       # FFT 取前 3 个主周期
dropout:    0.1

# 训练
batch:        16    # BN=16×1024=16384，安全范围
epochs:       100
lr:           0.001
weight_decay: 0.0001
patience:     15

save_path: outputs/checkpoints/timesnet/best.pt
log_dir:   outputs/logs/timesnet
