<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="78" font-size="56" font-weight="700" fill="#103B5C">系统落地：Pipeline → API → 地图 → 三级预警</text><text x="1165" y="64" font-size="16" fill="#526372">27</text></g>
 <g id="architecture" font-family="Microsoft YaHei, Arial, sans-serif">
  <g><rect x="55" y="120" width="650" height="95" fill="#EAF0F5"/><use data-icon="tabler-outline/route" x="75" y="142" width="46" height="46" stroke="#2A7F9E" stroke-width="2" fill="none"/><text x="145" y="160" font-size="34" font-weight="700" fill="#103B5C">Batch / realtime 微批</text><text x="145" y="195" font-size="18" fill="#526372">预处理、特征、ensemble 推理、异常融合</text></g>
  <g><rect x="55" y="235" width="650" height="95" fill="#FFFFFF" stroke="#C9D5DF"/><use data-icon="tabler-outline/api" x="75" y="257" width="46" height="46" stroke="#2A7F9E" stroke-width="2" fill="none"/><text x="145" y="275" font-size="34" font-weight="700" fill="#103B5C">FastAPI 服务</text><text x="145" y="310" font-size="18" fill="#526372">热力图、24h 预测、事件、区域/时间查询</text></g>
  <g><rect x="55" y="350" width="650" height="95" fill="#FFFFFF" stroke="#C9D5DF"/><use data-icon="tabler-outline/device-desktop" x="75" y="372" width="46" height="46" stroke="#2A7F9E" stroke-width="2" fill="none"/><text x="145" y="390" font-size="34" font-weight="700" fill="#103B5C">Streamlit 地图 Web</text><text x="145" y="425" font-size="18" fill="#526372">热力图、预测动画、事件详情与历史统计</text></g>
  <g><rect x="55" y="465" width="650" height="130" fill="#103B5C"/><use data-icon="tabler-outline/alert-triangle" x="75" y="493" width="52" height="52" stroke="#F26A2E" stroke-width="2" fill="none"/><text x="145" y="505" font-size="34" font-weight="700" fill="#FFFFFF">三级预警</text><text x="145" y="548" font-size="32" fill="#FFFFFF">一般 110 · 重要 15 · 紧急 6</text><text x="145" y="580" font-size="18" fill="#C9D5DF">重要：弹窗；紧急：弹窗 + 声音</text></g>
 </g>
 <g id="evidence" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="735" y="120" width="215" height="285" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/week6_web_screenshot.png" x="748" y="132" width="189" height="260" preserveAspectRatio="xMidYMid meet"/><text x="842" y="430" text-anchor="middle" font-size="18" fill="#526372">现有 Web 原型</text>
  <rect x="975" y="120" width="250" height="285" fill="#EAF0F5" stroke="#2A7F9E" stroke-width="2" stroke-dasharray="10 7"/><use data-icon="tabler-outline/device-desktop" x="1067" y="190" width="66" height="66" stroke="#2A7F9E" stroke-width="2" fill="none"/><text x="1100" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#103B5C"><tspan x="1100">替换为最新首页 /</tspan><tspan x="1100" dy="30">三级预警弹窗截图</tspan></text>
  <rect x="735" y="465" width="490" height="130" fill="#FFFFFF" stroke="#F26A2E" stroke-width="2" stroke-dasharray="10 7"/><text x="980" y="520" text-anchor="middle" font-size="34" font-weight="700" fill="#F26A2E">Web 操作短视频</text><text x="980" y="560" text-anchor="middle" font-size="18" fill="#526372">答辩时插入 20–30 秒地图交互录屏</text></g>
 <g id="footer" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="660" font-size="18" fill="#526372">地图事件 131/131 可定位：108 主中心 + 23 最高分网格补位。</text></g>
</svg>
