<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#C9D5DF"/></marker></defs>
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="76" font-size="52" font-weight="700" fill="#103B5C">时间建模：保留 Transformer 核心</text><text x="1165" y="64" font-size="16" fill="#526372">17</text></g>
 <g id="paper" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="55" y="112" width="400" height="490" fill="#FFFFFF" stroke="#C9D5DF"/><text x="78" y="152" font-size="28" font-weight="700" fill="#103B5C">原论文：序列到序列</text><image href="../images/paper_figures/transformer_fig1_architecture.png" x="110" y="170" width="290" height="360" preserveAspectRatio="xMidYMid meet"/><text x="78" y="570" font-size="16" fill="#526372">Vaswani et al., NeurIPS 2017, Fig. 1</text></g>
 <path d="M470 355H525" stroke="#C9D5DF" stroke-width="5" marker-end="url(#a)"/>
 <g id="project" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="540" y="112" width="685" height="490" fill="#FFFFFF" stroke="#C9D5DF"/><text x="570" y="152" font-size="28" font-weight="700" fill="#103B5C">项目时间路径：每个节点内独立建模 48 步</text>
  <g id="tokens"><rect x="570" y="180" width="160" height="64" fill="#EAF0F5"/><text x="650" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#103B5C">输入 token</text><text x="650" y="231" text-anchor="middle" font-size="16" fill="#526372">flow + context</text><path d="M730 212H770" stroke="#C9D5DF" stroke-width="4" marker-end="url(#a)"/><rect x="785" y="180" width="180" height="64" fill="#2A7F9E"/><text x="875" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4-head Self-Attn</text><path d="M965 212H1005" stroke="#C9D5DF" stroke-width="4" marker-end="url(#a)"/><rect x="1020" y="180" width="170" height="64" fill="#103B5C"/><text x="1105" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">FFN + Norm</text><text x="1105" y="231" text-anchor="middle" font-size="16" fill="#C9D5DF">2 layers</text></g>
  <line x1="570" y1="275" x2="1190" y2="275" stroke="#DDE5EC"/>
  <g id="kept"><text x="570" y="315" font-size="22" font-weight="700" fill="#2E7D5B">保留的机制</text><text x="570" y="350" font-size="16" fill="#17212B">• 48 步多头自注意力</text><text x="570" y="380" font-size="16" fill="#17212B">• 残差、LayerNorm、前馈网络</text><text x="570" y="410" font-size="16" fill="#17212B">• 时段、星期、节假日编码</text></g>
  <g id="changed"><text x="900" y="315" font-size="22" font-weight="700" fill="#F26A2E">主动简化</text><text x="900" y="350" font-size="16" fill="#526372">• 不使用完整 decoder</text><text x="900" y="380" font-size="16" fill="#526372">• 时间与空间路径拆分</text><text x="900" y="410" font-size="16" fill="#526372">• 直接输出未来 48 步</text></g>
  <rect x="570" y="455" width="620" height="105" fill="#EAF0F5"/><text x="595" y="493" font-size="24" font-weight="700" fill="#103B5C">为什么不是“照搬 Transformer”？</text><text x="595" y="529" font-size="18" fill="#526372">论文机制解决依赖建模；项目结构还必须服从网格拓扑、显存预算和 24h 多步预测。</text>
 </g>
 <g id="footer" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="680" font-size="16" fill="#526372">配置：d_model=32，4 heads，2 layers；最终单模型约 0.052M 参数。</text></g>
</svg>
