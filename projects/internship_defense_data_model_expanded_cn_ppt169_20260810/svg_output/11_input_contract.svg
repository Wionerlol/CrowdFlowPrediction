<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="74" font-size="48" font-weight="700" fill="#103B5C">最终输入契约：动态 9 维，静态 33 维</text><text x="1200" y="64" font-size="16" fill="#526372">11</text><text x="55" y="114" font-size="20" fill="#526372">“构建出来”不等于“进入模型”：列选择、广播方式和归一化统计都被固定在训练配置中。</text></g>
 <g id="flow" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect x="55" y="165" width="260" height="135" fill="#103B5C"/><text x="80" y="205" font-size="24" font-weight="700" fill="#FFFFFF">流量历史 · 2维</text><text x="80" y="242" font-size="18" fill="#EAF0F5">inflow + outflow</text><text x="80" y="275" font-size="18" fill="#FFFFFF">(B, N, 48, 2)</text>
  <path d="M315 232H390" stroke="#C9D5DF" stroke-width="4"/><path d="M375 222L390 232L375 242" fill="none" stroke="#C9D5DF" stroke-width="4"/>
  <rect x="390" y="165" width="300" height="135" fill="#2A7F9E"/><text x="415" y="205" font-size="24" font-weight="700" fill="#FFFFFF">真实时间/日历 · 7维</text><text x="415" y="238" font-size="16" fill="#EAF0F5">slot sin/cos · weekday sin/cos</text><text x="415" y="265" font-size="16" fill="#EAF0F5">weekend · holiday · workday</text><text x="655" y="289" text-anchor="end" font-size="16" fill="#FFFFFF">广播到每个 node</text>
  <path d="M690 232H765" stroke="#C9D5DF" stroke-width="4"/><path d="M750 222L765 232L750 242" fill="none" stroke="#C9D5DF" stroke-width="4"/>
  <rect x="765" y="165" width="220" height="135" fill="#FFFFFF" stroke="#F26A2E" stroke-width="3"/><text x="790" y="205" font-size="24" font-weight="700" fill="#103B5C">动态输入 · 9维</text><text x="790" y="245" font-size="18" fill="#526372">每节点每时刻</text><text x="790" y="278" font-size="18" font-weight="700" fill="#F26A2E">F_in = 2 + 7 = 9</text>
  <path d="M985 232H1060" stroke="#C9D5DF" stroke-width="4"/><path d="M1045 222L1060 232L1045 242" fill="none" stroke="#C9D5DF" stroke-width="4"/>
  <rect x="1060" y="165" width="165" height="135" fill="#2E7D5B"/><text x="1142" y="210" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">48 步未来</text><text x="1142" y="248" text-anchor="middle" font-size="18" fill="#EAF0F5">预测 inflow</text><text x="1142" y="278" text-anchor="middle" font-size="16" fill="#FFFFFF">(B,N,48)</text>
 </g>
 <g id="static_audit" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect x="55" y="345" width="550" height="205" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="385" font-size="26" font-weight="700" fill="#103B5C">41 → 33：防泄漏列审计</text><rect x="80" y="415" width="200" height="65" fill="#EAF0F5"/><text x="180" y="457" text-anchor="middle" font-size="30" font-weight="700" fill="#2A7F9E">41 候选维度</text><path d="M290 447H360" stroke="#C73E3A" stroke-width="4"/><path d="M345 437L360 447L345 457" fill="none" stroke="#C73E3A" stroke-width="4"/><rect x="370" y="415" width="200" height="65" fill="#103B5C"/><text x="470" y="457" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">33 正式维度</text><text x="80" y="515" font-size="17" fill="#C73E3A">删除 [27:35]：8 个由完整序列计算的历史流量画像</text><text x="80" y="540" font-size="16" fill="#526372">保留地理、路网、POI、遥感、站点与线路等真正静态信息。</text>
  <rect x="635" y="345" width="590" height="205" fill="#FFFFFF" stroke="#C9D5DF"/><text x="660" y="385" font-size="26" font-weight="700" fill="#103B5C">上下文怎样进入 AGFormer？</text><text x="660" y="425" font-size="18" fill="#526372">flow → Linear(2, d_model)</text><text x="660" y="455" font-size="18" fill="#526372">time → LayerNorm + Linear(7, d_model)</text><text x="660" y="485" font-size="18" fill="#526372">static → LayerNorm + Linear(33, d_model)</text><rect x="930" y="415" width="260" height="92" fill="#103B5C"/><text x="1060" y="451" text-anchor="middle" font-size="18" fill="#EAF0F5">gate = σ([flow, context])</text><text x="1060" y="482" text-anchor="middle" font-size="18" fill="#FFFFFF">h = flow + gate ⊙ context</text><text x="660" y="530" font-size="16" fill="#2E7D5B">门控让静态/时间贡献随节点和时段变化。</text>
 </g>
 <g id="candidates" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="55" y="580" width="1170" height="72" fill="#EAF0F5"/><text x="80" y="611" font-size="18" font-weight="700" fill="#103B5C">未进入最终输入：</text><text x="245" y="611" font-size="17" fill="#17212B">12维天气虽实现 22,484/22,484 精确时间对齐，但消融没有稳定收益；周期滞后也因有效窗口减少而被拒绝。</text><text x="80" y="640" font-size="16" fill="#526372">scaler 的 mean/std 仅由 train 段计算，并复用于 validation/test。</text></g>
</svg>
