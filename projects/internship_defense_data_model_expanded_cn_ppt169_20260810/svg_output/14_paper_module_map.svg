<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="76" font-size="50" font-weight="700" fill="#103B5C">从论文框架到项目模块：借用机制，不照搬任务</text><text x="1165" y="64" font-size="16" fill="#526372">14</text><text x="55" y="116" font-size="18" fill="#526372">四篇核心论文分别回答空间传播、未知依赖、长时注意力和全时空 token 化。</text></g>
 <g id="papers" font-family="Microsoft YaHei, Arial, sans-serif">
  <g id="stgcn"><rect x="55" y="140" width="570" height="225" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/paper_figures/stgcn_fig2_architecture.png" x="72" y="160" width="235" height="150" preserveAspectRatio="xMidYMid meet"/><text x="325" y="180" font-size="28" font-weight="700" fill="#103B5C">STGCN</text><text x="325" y="216" font-size="18" fill="#17212B">借用：显式图卷积与时空交替思路</text><text x="325" y="248" font-size="18" fill="#526372">改造：时间卷积替换为自注意力</text><text x="325" y="280" font-size="18" fill="#526372">原因：需要覆盖 48 步长时依赖</text><text x="72" y="344" font-size="16" fill="#526372">Yu et al., IJCAI 2018, Fig. 2</text></g>
  <g id="gwn"><rect x="655" y="140" width="570" height="225" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/paper_figures/graph_wavenet_fig3_architecture.png" x="675" y="157" width="220" height="165" preserveAspectRatio="xMidYMid meet"/><text x="915" y="180" font-size="28" font-weight="700" fill="#103B5C">Graph WaveNet</text><text x="915" y="216" font-size="18" fill="#17212B">借用：节点嵌入学习自适应邻接</text><text x="915" y="248" font-size="18" fill="#526372">保留：规则网格的显式空间图</text><text x="915" y="280" font-size="18" fill="#526372">目的：已知与未知空间依赖互补</text><text x="675" y="344" font-size="16" fill="#526372">Wu et al., IJCAI 2019, Fig. 3</text></g>
  <g id="transformer"><rect x="55" y="390" width="570" height="225" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/paper_figures/transformer_fig1_architecture.png" x="82" y="405" width="155" height="185" preserveAspectRatio="xMidYMid meet"/><text x="260" y="430" font-size="28" font-weight="700" fill="#103B5C">Transformer</text><text x="260" y="466" font-size="18" fill="#17212B">借用：多头注意力、残差、归一化、FFN</text><text x="260" y="498" font-size="18" fill="#526372">改造：仅保留 encoder 式时间路径</text><text x="260" y="530" font-size="18" fill="#526372">避免：完整 decoder 带来的额外复杂度</text><text x="260" y="562" font-size="18" fill="#526372">作用：每个节点内建模 48 步依赖</text><text x="72" y="600" font-size="16" fill="#526372">Vaswani et al., NeurIPS 2017, Fig. 1</text></g>
  <g id="stf"><rect x="655" y="390" width="570" height="225" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/paper_figures/spacetimeformer_fig3_architecture.png" x="675" y="405" width="170" height="185" preserveAspectRatio="xMidYMid meet"/><text x="865" y="430" font-size="28" font-weight="700" fill="#F26A2E">Spacetimeformer</text><text x="865" y="466" font-size="18" fill="#17212B">借用：变量×时间 token 与 local/global attention</text><text x="865" y="498" font-size="18" fill="#526372">对齐：value/time、given、target embedding</text><text x="865" y="530" font-size="18" fill="#526372">对齐：encoder-decoder 与 cross-attention</text><text x="865" y="562" font-size="18" fill="#526372">角色：作为通用注意力架构的挑战者</text><text x="675" y="600" font-size="16" fill="#526372">Grigsby et al., arXiv:2109.12218, Fig. 3</text></g>
 </g>
 <g id="footer" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="55" y="642" width="1170" height="48" fill="#103B5C"/><text x="640" y="673" text-anchor="middle" font-size="18" fill="#FFFFFF">项目 AGFormer 是面向本任务的组合实现：论文提供模块假设，消融实验决定是否保留。</text></g>
</svg>
