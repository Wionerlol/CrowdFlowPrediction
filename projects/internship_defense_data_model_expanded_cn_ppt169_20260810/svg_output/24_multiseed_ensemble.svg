 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="76" font-size="52" font-weight="700" fill="#103B5C">多 seed 复验确认方向，ensemble 再降低预测方差</text><text x="1165" y="64" font-size="16" fill="#526372">24</text></g>
 <g id="charts"><rect x="55" y="110" width="560" height="350" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="148" font-size="24" font-weight="700" fill="#103B5C" font-family="Microsoft YaHei, Arial, sans-serif">四个独立训练 seed</text><image href="../images/fig4_2_linear_multiseed.png" x="75" y="165" width="520" height="275" preserveAspectRatio="xMidYMid meet"/>
 <rect x="645" y="110" width="580" height="350" fill="#FFFFFF" stroke="#C9D5DF"/><text x="670" y="148" font-size="24" font-weight="700" fill="#103B5C" font-family="Microsoft YaHei, Arial, sans-serif">ensemble 在各预测时域的误差</text><image href="../images/fig5_1_ensemble_horizon.png" x="665" y="165" width="540" height="275" preserveAspectRatio="xMidYMid meet"/></g>
 <g id="summary" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect x="55" y="490" width="270" height="145" fill="#FFFFFF" stroke="#C9D5DF"/><text x="78" y="525" font-size="18" fill="#526372">单模型 seed42</text><text x="78" y="580" font-size="48" font-weight="700" fill="#103B5C">16.1132</text><text x="78" y="615" font-size="16" fill="#526372">最低单模型 MAE</text>
  <rect x="345" y="490" width="280" height="145" fill="#FFFFFF" stroke="#C9D5DF"/><text x="368" y="525" font-size="18" fill="#526372">4-seed 单模型均值</text><text x="368" y="575" font-size="38" font-weight="700" fill="#2A7F9E">16.4961</text><text x="368" y="610" font-size="18" fill="#526372">± 0.2850</text>
  <rect x="645" y="490" width="300" height="145" fill="#103B5C"/><text x="670" y="525" font-size="18" fill="#C9D5DF">逐样本预测均值</text><text x="670" y="580" font-size="50" font-weight="700" fill="#F26A2E">15.9030</text><text x="670" y="615" font-size="16" fill="#FFFFFF">MAE · RMSE 30.2250</text>
  <rect x="965" y="490" width="260" height="145" fill="#EAF0F5"/><text x="988" y="525" font-size="20" font-weight="700" fill="#103B5C">部署权衡</text><text x="988" y="560" font-size="18" fill="#526372">离线异常检测：4 模型</text><text x="988" y="590" font-size="18" fill="#526372">实时 API：seed42 降级</text><text x="988" y="620" font-size="16" fill="#C97A11">约 4× forward 成本</text>
 </g>
