<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#C9D5DF"/></marker></defs>
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="76" font-size="52" font-weight="700" fill="#103B5C">空间建模：显式图 + 自适应图</text><text x="1165" y="64" font-size="16" fill="#526372">16</text></g>
 <g id="evidence" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect x="55" y="110" width="550" height="365" fill="#FFFFFF" stroke="#C9D5DF"/><text x="78" y="150" font-size="28" font-weight="700" fill="#103B5C">STGCN：规则图上的局部传播</text><image href="../images/paper_figures/stgcn_fig2_architecture.png" x="75" y="170" width="510" height="240" preserveAspectRatio="xMidYMid meet"/><text x="78" y="440" font-size="18" fill="#526372">T-GCN-T 结构把邻接矩阵 W 直接写入空间模块。</text><text x="78" y="463" font-size="16" fill="#526372">来源：Yu et al., IJCAI 2018, Fig. 2</text>
  <rect x="675" y="110" width="550" height="365" fill="#FFFFFF" stroke="#C9D5DF"/><text x="698" y="150" font-size="28" font-weight="700" fill="#103B5C">Graph WaveNet：数据驱动的隐式依赖</text><image href="../images/paper_figures/graph_wavenet_fig3_architecture.png" x="700" y="165" width="500" height="245" preserveAspectRatio="xMidYMid meet"/><text x="698" y="440" font-size="18" fill="#526372">节点嵌入补全先验图未覆盖的远距离联系。</text><text x="698" y="463" font-size="16" fill="#526372">来源：Wu et al., IJCAI 2019, Fig. 3</text>
 </g>
 <g id="project" font-family="Microsoft YaHei, Arial, sans-serif"><path d="M330 480V515M950 480V515" stroke="#C9D5DF" stroke-width="4" marker-end="url(#a)"/><rect x="130" y="520" width="1020" height="120" fill="#103B5C"/><text x="165" y="560" font-size="30" font-weight="700" fill="#FFFFFF">项目 AGFormer 的空间路径</text><text x="165" y="600" font-size="24" fill="#EAF0F5">预定义 spatial GCN</text><text x="465" y="600" font-size="24" fill="#F26A2E">+</text><text x="510" y="600" font-size="24" fill="#EAF0F5">节点嵌入 adaptive adjacency</text><text x="900" y="600" font-size="24" fill="#F26A2E">→</text><text x="950" y="600" font-size="24" fill="#FFFFFF">融合后进入预测头</text></g>
 <g id="footer" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="682" font-size="16" fill="#526372">为何有效：32×32 规则网格具有稳定邻域关系；显式图降低搜索空间，自适应图负责补充非局部相关。</text></g>
</svg>
