<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="76" font-size="50" font-weight="700" fill="#103B5C">时间连续性：不把跨季节缺口伪装成历史</text><text x="1200" y="64" font-size="16" fill="#526372">08</text><text x="55" y="118" font-size="22" fill="#526372">后期审计识别出 73 处非连续间隔；每个 96 步样本必须包含 95 个连续的 30 分钟边。</text></g>
 <g id="timeline" font-family="Microsoft YaHei, Arial, sans-serif">
  <text x="55" y="190" font-size="24" font-weight="700" fill="#C73E3A">错误做法</text><line x1="205" y1="182" x2="1190" y2="182" stroke="#C9D5DF" stroke-width="6"/><line x1="250" y1="182" x2="505" y2="182" stroke="#C73E3A" stroke-width="8"/><line x1="780" y1="182" x2="1080" y2="182" stroke="#C73E3A" stroke-width="8"/><path d="M505 182 C600 105 690 255 780 182" fill="none" stroke="#C73E3A" stroke-width="5" stroke-dasharray="11 8"/><text x="640" y="158" text-anchor="middle" font-size="18" fill="#C73E3A">数组相邻 ≠ 时间相邻</text>
  <text x="55" y="290" font-size="24" font-weight="700" fill="#2E7D5B">最终规则</text><line x1="205" y1="282" x2="505" y2="282" stroke="#2A7F9E" stroke-width="8"/><line x1="780" y1="282" x2="1080" y2="282" stroke="#2A7F9E" stroke-width="8"/><path d="M620 250L650 282L620 314M690 250L660 282L690 314" fill="none" stroke="#2E7D5B" stroke-width="5"/><text x="640" y="340" text-anchor="middle" font-size="18" fill="#526372">缺口处禁止生成滑窗，不做全局插值</text>
 </g>
 <g id="gates" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect x="55" y="390" width="360" height="190" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="428" font-size="24" font-weight="700" fill="#103B5C">真实时间戳</text><text x="80" y="464" font-size="18" fill="#526372">YYYYMMDDSS → 本地半小时槽</text><text x="80" y="493" font-size="18" fill="#526372">→ UTC datetime64[s]</text><text x="80" y="535" font-size="18" fill="#2E7D5B">消除序号推算造成的星期漂移</text>
  <rect x="460" y="390" width="360" height="190" fill="#FFFFFF" stroke="#C9D5DF"/><text x="485" y="428" font-size="24" font-weight="700" fill="#103B5C">顺序切分</text><text x="485" y="464" font-size="18" fill="#526372">train / val / test = 7 : 1 : 2</text><text x="485" y="493" font-size="18" fill="#526372">训练集拟合 mean / std</text><text x="485" y="535" font-size="18" fill="#2E7D5B">测试集最终保留 4,022 个窗口</text>
  <rect x="865" y="390" width="360" height="190" fill="#103B5C"/><text x="890" y="428" font-size="24" font-weight="700" fill="#FFFFFF">异常值处理边界</text><text x="890" y="464" font-size="18" fill="#EAF0F5">早期清洗曾对 |z| &gt; 5 点插值</text><text x="890" y="493" font-size="18" fill="#EAF0F5">预测训练使用清洗序列</text><text x="890" y="535" font-size="18" fill="#F26A2E">生产异常检测应同时保留原始镜像</text>
 </g>
 <g id="takeaway" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="55" y="610" width="1170" height="58" fill="#EAF0F5"/><text x="80" y="647" font-size="20" font-weight="700" fill="#103B5C">关键修复：</text><text x="205" y="647" font-size="18" fill="#17212B">时间连续性从“预处理报告中的假设”升级为训练 Dataset 每次取窗时的硬约束。</text></g>
</svg>
