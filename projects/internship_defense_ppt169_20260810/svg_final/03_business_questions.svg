<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC" /><rect x="0" y="0" width="1280" height="12" fill="#F26A2E" /></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="58" y="88" font-size="56" font-weight="700" fill="#103B5C">网约车安全场景需要“预知—识别—处置”</text><text x="1128" y="70" font-size="16" fill="#526372">03</text></g>
 <g id="role" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect x="58" y="145" width="395" height="475" fill="#103B5C" />
  
  <g transform="translate(92, 185) scale(2.91667)" fill="none" stroke="#F26A2E" stroke-width="2">
    <path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" />
    <path d="M15 19l2 2l4 -4" />
  </g>
  <text x="92" y="310" font-size="34" font-weight="700" fill="#FFFFFF">岗位背景</text>
  <text fill="#EAF0F5" font-size="32" x="92" y="365">网约车安全方向</text><text fill="#EAF0F5" font-size="32" x="92" y="413">算法实习生</text><line x1="92" y1="482" x2="390" y2="482" stroke="#2A7F9E" stroke-width="2" />
  <text fill="#C9D5DF" font-size="18" x="92" y="530">目标不是只预测一个数，</text><text fill="#C9D5DF" font-size="18" x="92" y="560">而是形成可处置的安全事件。</text></g>
 <g id="decision-chain" font-family="Microsoft YaHei, Arial, sans-serif">
  <path d="M535 250H580M535 390H580M535 530H580" stroke="#F26A2E" stroke-width="4" />
  <path d="M605 260V515" stroke="#C9D5DF" stroke-width="3" />
  <circle cx="605" cy="240" r="16" fill="#F26A2E" /><circle cx="605" cy="380" r="16" fill="#2A7F9E" /><circle cx="605" cy="520" r="16" fill="#103B5C" />
  <text x="655" y="220" font-size="34" font-weight="700" fill="#F26A2E">预知</text><text x="655" y="263" font-size="32" fill="#17212B">各区域未来 24 小时如何变化？</text>
  <text x="655" y="360" font-size="34" font-weight="700" fill="#2A7F9E">识别</text><text x="655" y="403" font-size="32" fill="#17212B">哪些波动超出正常范围？</text>
  <text x="655" y="500" font-size="34" font-weight="700" fill="#103B5C">处置</text><text x="655" y="543" font-size="32" fill="#17212B">事件属于哪类，应触发哪级预警？</text>
 </g>
 <g id="footer" font-family="Microsoft YaHei, Arial, sans-serif"><text x="58" y="680" font-size="18" fill="#526372">连续决策链：区域 × 时间 × 异常类型 × 预警动作</text></g>
</svg>