<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC" /></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="82" font-size="56" font-weight="700" fill="#103B5C">数据处理：gap-aware、时序划分、无泄漏</text><text x="1165" y="65" font-size="16" fill="#526372">08</text><text x="55" y="132" font-size="36" fill="#17212B">最大难点不是缺值，而是不连续时间被误当作连续历史。</text></g>
 <g id="before" font-family="Microsoft YaHei, Arial, sans-serif"><text x="65" y="225" font-size="34" font-weight="700" fill="#C73E3A">错误拼接</text><line x1="245" y1="215" x2="1140" y2="215" stroke="#C9D5DF" stroke-width="6" /><g fill="#C73E3A"><circle cx="300" cy="215" r="11" /><circle cx="390" cy="215" r="11" /><circle cx="480" cy="215" r="11" /><circle cx="830" cy="215" r="11" /><circle cx="920" cy="215" r="11" /></g><path d="M480 215C590 160 720 270 830 215" fill="none" stroke="#C73E3A" stroke-width="5" stroke-dasharray="10 8" /><text x="655" y="185" font-size="18" fill="#C73E3A">跨缺口伪连续窗口</text></g>
 <g id="after" font-family="Microsoft YaHei, Arial, sans-serif"><text x="65" y="335" font-size="34" font-weight="700" fill="#2E7D5B">真实连续</text><line x1="245" y1="325" x2="540" y2="325" stroke="#2A7F9E" stroke-width="6" /><line x1="790" y1="325" x2="1140" y2="325" stroke="#2A7F9E" stroke-width="6" /><g fill="#2E7D5B"><circle cx="300" cy="325" r="11" /><circle cx="390" cy="325" r="11" /><circle cx="480" cy="325" r="11" /><circle cx="830" cy="325" r="11" /><circle cx="920" cy="325" r="11" /></g><text x="635" y="335" font-size="18" fill="#526372">窗口在缺口处截断</text></g>
 <g id="gates" font-family="Microsoft YaHei, Arial, sans-serif">
  <g><rect x="60" y="420" width="350" height="160" fill="#FFFFFF" stroke="#C9D5DF" /><text x="85" y="465" font-size="34" font-weight="700" fill="#103B5C">01 时间规则</text><text fill="#526372" font-size="18" x="85" y="515">真实时间戳 + gap 过滤</text><text fill="#526372" font-size="18" x="85" y="547">48 步历史 → 48 步未来</text></g>
  <g><rect x="465" y="420" width="350" height="160" fill="#FFFFFF" stroke="#C9D5DF" /><text x="490" y="465" font-size="34" font-weight="700" fill="#103B5C">02 切分规则</text><text fill="#526372" font-size="18" x="490" y="515">训练 / 验证 / 测试 = 7:1:2</text><text fill="#526372" font-size="18" x="490" y="547">保持时间顺序，不随机打乱</text></g>
  <g><rect x="870" y="420" width="350" height="160" fill="#103B5C" /><text x="895" y="465" font-size="34" font-weight="700" fill="#FFFFFF">03 防泄漏</text><text fill="#EAF0F5" font-size="18" x="895" y="515">scaler 仅在训练段拟合</text><text fill="#EAF0F5" font-size="18" x="895" y="547">测试保留 4,022 个连续窗口</text></g>
 </g>
 <g id="footer" font-family="Microsoft YaHei, Arial, sans-serif"><text x="60" y="650" font-size="18" fill="#526372">Checkpoint 同步保存配置、数据规则与缩放信息，避免实验条件变化后误用旧模型。</text></g>
</svg>