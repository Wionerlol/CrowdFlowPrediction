<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="82" font-size="56" font-weight="700" fill="#103B5C">从经典时空图到长序列 Transformer</text><text x="1160" y="65" font-size="16" fill="#526372">06</text><text x="55" y="132" font-size="36" fill="#17212B">文献帮助我把空间先验、长时依赖和无监督异常检测组合成可验证路线。</text></g>
 <g id="timeline" font-family="Microsoft YaHei, Arial, sans-serif">
  <line x1="90" y1="330" x2="1190" y2="330" stroke="#C9D5DF" stroke-width="4"/>
  <g id="p1"><circle cx="125" cy="330" r="16" fill="#2A7F9E"/><text x="125" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#103B5C">GCN</text><text x="125" y="380" text-anchor="middle" font-size="18" fill="#526372">图传播</text></g>
  <g id="p2"><circle cx="315" cy="330" r="16" fill="#2A7F9E"/><text x="315" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#103B5C">STGCN</text><text x="315" y="380" text-anchor="middle" font-size="18" fill="#526372">时空卷积</text></g>
  <g id="p3"><circle cx="505" cy="330" r="16" fill="#2A7F9E"/><text x="505" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#103B5C">Transformer</text><text x="505" y="380" text-anchor="middle" font-size="18" fill="#526372">全局依赖</text></g>
  <g id="p4"><circle cx="695" cy="330" r="16" fill="#2A7F9E"/><text x="695" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#103B5C">Graph WaveNet</text><text x="695" y="380" text-anchor="middle" font-size="18" fill="#526372">自适应邻接</text></g>
  <g id="p5"><circle cx="900" cy="330" r="16" fill="#F26A2E"/><text x="900" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#F26A2E">Spacetimeformer</text><text x="900" y="380" text-anchor="middle" font-size="18" fill="#526372">变量 × 时间 token</text></g>
  <g id="p6"><circle cx="1120" cy="330" r="16" fill="#2E7D5B"/><text x="1120" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#103B5C">VAE / SHAP</text><text x="1120" y="380" text-anchor="middle" font-size="18" fill="#526372">异常与解释</text></g>
 </g>
 <g id="decision" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="55" y="468" width="1170" height="150" fill="#103B5C"/><use data-icon="tabler-outline/file-analytics" x="85" y="500" width="58" height="58" stroke="#F26A2E" stroke-width="2" fill="none"/><text x="170" y="520" font-size="34" font-weight="700" fill="#FFFFFF">项目决策</text><text x="170" y="570" font-size="32" fill="#EAF0F5">显式空间图 + 学习自适应图 + Transformer 时间建模 + 三路异常融合</text><text x="170" y="605" font-size="18" fill="#C9D5DF">AGFormer 为项目自主组合实现，不冒充同名外部论文复现。</text></g>
 <g id="footer" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="680" font-size="16" fill="#526372">主要论文详见第 21 页；论文路线服务于实验问题，而非模型堆叠。</text></g>
</svg>
