<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="78" font-size="56" font-weight="700" fill="#103B5C">四 seed 集成把 24h MAE 降至 15.9030</text><text x="1165" y="64" font-size="16" fill="#526372">14</text></g>
 <g id="selection"><rect x="55" y="112" width="760" height="390" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/fig6_1_final_model_selection.png" x="75" y="132" width="720" height="350" preserveAspectRatio="xMidYMid meet"/></g>
 <g id="kpis" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="845" y="112" width="380" height="390" fill="#103B5C"/><text x="875" y="158" font-size="18" fill="#C9D5DF">同一 4,022 个测试窗口</text><text x="875" y="235" font-size="64" font-weight="700" fill="#F26A2E">11.3019</text><text x="875" y="270" font-size="18" fill="#FFFFFF">h1 MAE · RMSE 19.8621</text><line x1="875" y1="300" x2="1195" y2="300" stroke="#2A7F9E"/><text x="875" y="370" font-size="64" font-weight="700" fill="#FFFFFF">15.9030</text><text x="875" y="405" font-size="18" fill="#FFFFFF">24h 平均 MAE</text><text x="875" y="448" font-size="18" fill="#C9D5DF">RMSE 30.2250 · MAPE 35.4350</text><text x="875" y="480" font-size="18" fill="#2E7D5B">相对 gated 基线 MAE ↓ 3.82%</text></g>
 <g id="horizon" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="55" y="530" width="1170" height="125" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/prediction_horizon_residual.png" x="75" y="545" width="750" height="95" preserveAspectRatio="xMidYMid meet"/><text x="855" y="570" font-size="34" font-weight="700" fill="#103B5C">误差边界</text><text x="855" y="610" font-size="18" fill="#526372"><tspan x="855">误差随预测时域扩大而上升；</tspan><tspan x="855" dy="28">Web 端应提示远期不确定性。</tspan></text></g>
 <g id="footer" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="690" font-size="16" fill="#526372">模型选择在验证集完成；ensemble 的 MAE 最低，单模型 RMSE 略低，指标间存在权衡。</text></g>
</svg>
