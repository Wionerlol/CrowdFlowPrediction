<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g><g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="82" font-size="56" font-weight="700" fill="#103B5C">Features and Graphs: Build Broadly, Ablate Strictly</text><text x="1160" y="65" font-size="16" fill="#526372">09</text><text x="55" y="132" font-size="36" fill="#17212B">More sources do not imply indiscriminate feature injection.</text></g><g id="funnel" font-family="Arial, Microsoft YaHei, sans-serif"><text x="60" y="215" font-size="34" font-weight="700" fill="#103B5C">Static-feature audit</text><path d="M75 255H500L430 390H145Z" fill="#EAF0F5" stroke="#C9D5DF"/><text x="288" y="310" text-anchor="middle" font-size="64" font-weight="700" fill="#2A7F9E">41</text><text x="288" y="347" text-anchor="middle" font-size="18" fill="#526372">candidate dimensions</text><path d="M145 410H430L380 520H195Z" fill="#103B5C"/><text x="288" y="475" text-anchor="middle" font-size="64" font-weight="700" fill="#FFFFFF">33</text><text x="288" y="510" text-anchor="middle" font-size="18" fill="#EAF0F5">leakage-safe static features</text><text x="70" y="595" font-size="18" fill="#526372">Final input also includes 7 calendar/time and 2 flow channels.</text></g><g id="graphs" font-family="Arial, Microsoft YaHei, sans-serif"><text x="590" y="215" font-size="34" font-weight="700" fill="#103B5C">Four candidate graphs</text><rect x="590" y="250" width="265" height="100" fill="#FFFFFF" stroke="#F26A2E" stroke-width="3"/><!-- icon: tabler-outline/graph -->
  <g transform="translate(610, 275) scale(1.83333)" fill="none" stroke="#F26A2E" stroke-width="2">
    <path d="M4 18v-12a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2" />
    <path d="M7 14l3 -3l2 2l3 -3l2 2" />
  </g><text x="680" y="292" font-size="32" fill="#17212B">Spatial adjacency</text><text x="680" y="325" font-size="18" fill="#526372">final explicit graph</text><rect x="885" y="250" width="265" height="100" fill="#FFFFFF" stroke="#C9D5DF"/><text x="915" y="292" font-size="32" fill="#17212B">POI similarity</text><text x="915" y="325" font-size="18" fill="#526372">candidate graph</text><rect x="590" y="380" width="265" height="100" fill="#FFFFFF" stroke="#C9D5DF"/><text x="620" y="422" font-size="32" fill="#17212B">Flow correlation</text><text x="620" y="455" font-size="18" fill="#526372">candidate graph</text><rect x="885" y="380" width="265" height="100" fill="#FFFFFF" stroke="#C9D5DF"/><text x="915" y="422" font-size="32" fill="#17212B">Rail topology</text><text x="915" y="455" font-size="18" fill="#526372">candidate graph</text><path d="M720 512H1015" stroke="#C9D5DF" stroke-width="3"/><circle cx="720" cy="512" r="11" fill="#F26A2E"/><circle cx="1015" cy="512" r="11" fill="#2A7F9E"/><text x="720" y="558" text-anchor="middle" font-size="18" fill="#526372">explicit spatial graph</text><text x="1015" y="558" text-anchor="middle" font-size="18" fill="#526372">learned adaptive graph</text><text x="870" y="607" text-anchor="middle" font-size="34" font-weight="700" fill="#103B5C">Final: dual-graph path</text></g><g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="585" y="630" width="600" height="48" fill="#EAF0F5"/><text x="605" y="661" font-size="18" fill="#526372">Multi-graph fusion did not win; context works better through gates than unconditional addition.</text></g></svg>
