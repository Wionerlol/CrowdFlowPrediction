<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="74" font-size="48" font-weight="700" fill="#103B5C">Four Edge Sets, Four Meanings of “Nearby”</text><text x="1200" y="64" font-size="16" fill="#526372">12</text><text x="55" y="114" font-size="20" fill="#526372">The 1,024 nodes are shared, but edge_index and edge_weight come from different relational assumptions.</text></g>
 <g id="cards" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="55" y="150" width="555" height="215" fill="#FFFFFF" stroke="#F26A2E" stroke-width="3"/><text x="80" y="190" font-size="28" font-weight="700" fill="#103B5C">G_spatial · geographic adjacency</text><text x="80" y="226" font-size="18" fill="#526372">Moore 8-neighborhood; orthogonal d=1, diagonal d=√2</text><text x="80" y="260" font-size="20" font-family="Consolas, Courier New, monospace" fill="#F26A2E">w = exp(−d² / 1.5²)</text><text x="80" y="298" font-size="18" fill="#526372">weights: 0.641 orthogonal; 0.411 diagonal</text><text x="80" y="337" font-size="24" font-weight="700" fill="#103B5C">7,812 directed edges · 7.6/node</text>
  <rect x="670" y="150" width="555" height="215" fill="#FFFFFF" stroke="#C9D5DF"/><text x="695" y="190" font-size="28" font-weight="700" fill="#103B5C">G_poi · functional similarity</text><text x="695" y="226" font-size="18" fill="#526372">11 POI densities → log1p → L2 normalization</text><text x="695" y="260" font-size="20" font-family="Consolas, Courier New, monospace" fill="#2A7F9E">w = cosine(poi_i, poi_j)</text><text x="695" y="298" font-size="18" fill="#526372">top-k=10 per node; transport removed</text><text x="695" y="337" font-size="24" font-weight="700" fill="#103B5C">10,240 directed edges · 10.0/node</text>
  <rect x="55" y="390" width="555" height="215" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="430" font-size="28" font-weight="700" fill="#103B5C">G_flow · synchronized demand</text><text x="80" y="466" font-size="18" fill="#526372">Pearson correlation between node inflow series</text><text x="80" y="500" font-size="20" font-family="Consolas, Courier New, monospace" fill="#2A7F9E">top-k=15; retain corr &gt; 0</text><text x="80" y="538" font-size="18" fill="#526372">models non-local synchronization, not distance</text><text x="80" y="577" font-size="24" font-weight="700" fill="#103B5C">15,255 directed edges · 14.9/node</text>
  <rect x="670" y="390" width="555" height="215" fill="#FFFFFF" stroke="#C9D5DF"/><text x="695" y="430" font-size="28" font-weight="700" fill="#103B5C">G_transit · rail topology</text><text x="695" y="466" font-size="18" fill="#526372">official station/line data matched to OSM coordinates</text><text x="695" y="500" font-size="20" font-family="Consolas, Courier New, monospace" fill="#2A7F9E">w = exp(−station_hops / 3)</text><text x="695" y="538" font-size="18" fill="#526372">up to 10 stops on the same line; bidirectional</text><text x="695" y="577" font-size="24" font-weight="700" fill="#103B5C">3,080 directed edges · 3.0/node</text>
 </g>
 <g id="storage" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="630" width="1170" height="52" fill="#103B5C"/><text x="80" y="663" font-size="16" fill="#FFFFFF">Artifact: edge_index (2,E) + edge_weight (E) + num_nodes; G_flow was candidate-only and excluded from the final model.</text></g>
</svg>
