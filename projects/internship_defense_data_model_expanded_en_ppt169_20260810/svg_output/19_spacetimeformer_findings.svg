<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="76" font-size="38" font-weight="700" fill="#103B5C">Why the Better-Aligned Spacetimeformer Still Lost</text><text x="1200" y="64" font-size="16" fill="#526372">19</text></g>
 <g id="chart"><rect x="55" y="110" width="730" height="430" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/fig3_2_spacetimeformer_ablation.png" x="75" y="130" width="690" height="390" preserveAspectRatio="xMidYMid meet"/></g>
 <g id="reasons" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="815" y="110" width="410" height="100" fill="#FFFFFF" stroke="#C9D5DF"/><text x="840" y="142" font-size="20" font-weight="700" fill="#103B5C">1 · Capacity was not the bottleneck</text><text x="840" y="174" font-size="16" fill="#526372">0.030M → 0.082M; MAE 17.9967 → 18.6715</text><text x="840" y="197" font-size="16" fill="#C97A11">More parameters generalized worse</text>
  <rect x="815" y="220" width="410" height="100" fill="#FFFFFF" stroke="#C9D5DF"/><text x="840" y="252" font-size="20" font-weight="700" fill="#103B5C">2 · Global attention needed approximation</text><text x="840" y="284" font-size="16" fill="#526372">49,152 tokens make quadratic attention infeasible</text><text x="840" y="307" font-size="16" fill="#C97A11">Approximation complicated optimization</text>
  <rect x="815" y="330" width="410" height="100" fill="#FFFFFF" stroke="#C9D5DF"/><text x="840" y="362" font-size="20" font-weight="700" fill="#103B5C">3 · Future time context added noise</text><text x="840" y="394" font-size="16" fill="#526372">MAE 18.4433 → 18.2950 after disabling it</text><text x="840" y="417" font-size="16" fill="#2E7D5B">RMSE 34.4038 → 33.4965</text>
  <rect x="815" y="440" width="410" height="100" fill="#103B5C"/><text x="840" y="472" font-size="20" font-weight="700" fill="#FFFFFF">4 · Explicit grid bias fit better</text><text x="840" y="502" font-size="16" fill="#EAF0F5">Known neighbors did not need relearning</text><text x="840" y="527" font-size="16" fill="#F26A2E">Best STF + linear MAE: 17.0688</text>
 </g>
 <g id="lesson" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="570" width="1170" height="82" fill="#EAF0F5"/><text x="78" y="600" font-size="22" font-weight="700" fill="#103B5C">Transferable discovery: the linear output path</text><text x="78" y="627" font-size="16" fill="#526372">It lowered STF MAE from 18.2950 to 17.0688. Gated STF improved MAPE, but its worse MAE/RMSE made it unsuitable for absolute-residual detection.</text></g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="688" font-size="16" fill="#526372">A failed challenger still identified the inductive-bias mismatch and produced a module worth transferring.</text></g>
</svg>
