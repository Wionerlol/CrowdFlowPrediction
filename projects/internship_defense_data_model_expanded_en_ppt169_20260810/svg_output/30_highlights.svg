<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F26A2E"/></marker></defs><g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g><g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="84" font-size="56" font-weight="700" fill="#103B5C">Highlights, Limitations and Next Steps</text><text x="1165" y="64" font-size="16" fill="#526372">30</text><text x="55" y="145" font-size="36" fill="#17212B">The key outcome is verifiable completeness—not one isolated model.</text></g><g id="pillars" font-family="Arial, Microsoft YaHei, sans-serif"><text x="60" y="260" font-size="64" font-weight="700" fill="#2A7F9E">01</text><text x="60" y="312" font-size="34" font-weight="700" fill="#103B5C">Trusted data</text><text x="60" y="360" font-size="18" fill="#526372"><tspan x="60">gap-aware and no leakage;</tspan><tspan x="60" dy="30">41 → 33 audited dimensions</tspan></text><line x1="380" y1="230" x2="380" y2="420" stroke="#C9D5DF"/><text x="430" y="260" font-size="64" font-weight="700" fill="#F26A2E">02</text><text x="430" y="312" font-size="34" font-weight="700" fill="#103B5C">Verifiable model</text><text x="430" y="360" font-size="18" fill="#526372"><tspan x="430">dual graph + gate + residual;</tspan><tspan x="430" dy="30">strict ablation and multi-seed</tspan></text><line x1="790" y1="230" x2="790" y2="420" stroke="#C9D5DF"/><text x="840" y="260" font-size="64" font-weight="700" fill="#2E7D5B">03</text><text x="840" y="312" font-size="34" font-weight="700" fill="#103B5C">Actionable system</text><text x="840" y="360" font-size="18" fill="#526372"><tspan x="840">fusion becomes classified events,</tspan><tspan x="840" dy="30">maps and tiered alerts</tspan></text></g><g id="limits" font-family="Arial, Microsoft YaHei, sans-serif"><text x="60" y="490" font-size="34" font-weight="700" fill="#C97A11">Limits</text><text x="170" y="490" font-size="18" fill="#526372">public prototype · weak labels · offline micro-batch</text><path d="M60 545H1170" stroke="#F26A2E" stroke-width="5" marker-end="url(#a)"/><text x="60" y="598" font-size="34" font-weight="700" fill="#103B5C">Next</text><text x="225" y="598" font-size="18" fill="#526372">authorized data → human labels → transfer → Optuna → streaming</text></g><g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="60" y="670" font-size="16" fill="#526372">Hard problems: time gaps, spatial mapping, 1024×48 attention, missing labels and resource limits.</text></g></svg>
