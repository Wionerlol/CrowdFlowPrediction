<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="76" font-size="38" font-weight="700" fill="#103B5C">Negative Results: Multi-Graph and Periodic Lags</text><text x="1200" y="64" font-size="16" fill="#526372">22</text></g>
 <g id="multigraph" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="112" width="555" height="440" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="152" font-size="28" font-weight="700" fill="#103B5C">A · Multi-graph AGFormer</text><image href="../images/fig3_4_multigraph_weights.png" x="80" y="170" width="505" height="245" preserveAspectRatio="xMidYMid meet"/><text x="80" y="446" font-size="18" fill="#17212B">flow 92.18% · spatial 7.37%</text><text x="80" y="474" font-size="18" fill="#526372">POI 0.42% · transit 0.02%</text><text x="80" y="509" font-size="18" fill="#C97A11">One global softmax collapsed toward the flow graph.</text><text x="80" y="535" font-size="18" fill="#C97A11">It could not express node- or time-specific graph value.</text></g>
 <g id="lags" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="640" y="112" width="585" height="440" fill="#FFFFFF" stroke="#C9D5DF"/><text x="665" y="152" font-size="28" font-weight="700" fill="#103B5C">B · lag_48 / lag_336 and deltas</text><text x="665" y="188" font-size="18" fill="#526372">Strict comparison on the same 3,433 test windows</text>
  <line x1="795" y1="245" x2="1165" y2="245" stroke="#DDE5EC"/><line x1="795" y1="245" x2="795" y2="375" stroke="#C9D5DF"/>
  <text x="665" y="287" font-size="18" fill="#17212B">Matched baseline</text><rect x="795" y="262" width="292" height="38" fill="#2A7F9E"/><text x="1100" y="288" font-size="18" font-weight="700" fill="#103B5C">16.2443</text>
  <text x="665" y="353" font-size="18" fill="#17212B">Periodic lags</text><rect x="795" y="328" width="323" height="38" fill="#F26A2E"/><text x="1132" y="354" font-size="18" font-weight="700" fill="#103B5C">17.9614</text>
  <text x="665" y="402" font-size="16" fill="#526372">avg MAE; lower is better</text><text x="665" y="445" font-size="18" fill="#526372">lag_48 overlaps with strong daily persistence;</text><text x="665" y="475" font-size="18" fill="#526372">lag_336 is brittle around holidays and gaps;</text><text x="665" y="505" font-size="18" fill="#C97A11">delta features amplify irregular shocks.</text></g>
 <g id="decision" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="580" width="1170" height="72" fill="#103B5C"/><text x="80" y="608" font-size="20" font-weight="700" fill="#FFFFFF">Next design</text><text x="220" y="608" font-size="16" fill="#EAF0F5">Node/head/layer graph routing and a learnable seasonal branch, instead of global graph scalars</text><text x="220" y="634" font-size="16" fill="#EAF0F5">or raw lag concatenation.</text><text x="945" y="634" font-size="16" fill="#F26A2E">Future hypotheses, not gains.</text></g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="690" font-size="16" fill="#526372">Multi-graph avg MAE was 16.9569, also behind the single-graph gated model at 16.5350.</text></g>
</svg>
