<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="78" font-size="52" font-weight="700" fill="#103B5C">From Raw Flow to a Training Tensor</text><text x="1200" y="64" font-size="16" fill="#526372">07</text><text x="55" y="122" font-size="22" fill="#526372">Time, space and data types are standardized before external context enters the node–time coordinate system.</text></g>
 <g id="pipeline" font-family="Arial, Microsoft YaHei, sans-serif">
  <line x1="170" y1="300" x2="1085" y2="300" stroke="#C9D5DF" stroke-width="5"/>
  <g id="stage1"><circle cx="170" cy="300" r="58" fill="#103B5C"/><use data-icon="tabler-outline/database" x="142" y="272" width="56" height="56" stroke="#FFFFFF" stroke-width="2" fill="none"/><text x="85" y="405" font-size="26" font-weight="700" fill="#103B5C">01 Ingest</text><text x="85" y="440" font-size="18" fill="#526372">14 time segments</text><text x="85" y="468" font-size="18" fill="#526372">inflow / outflow channels</text></g>
  <g id="stage2"><circle cx="475" cy="300" r="58" fill="#2A7F9E"/><use data-icon="tabler-outline/calendar" x="447" y="272" width="56" height="56" stroke="#FFFFFF" stroke-width="2" fill="none"/><text x="390" y="405" font-size="26" font-weight="700" fill="#103B5C">02 Normalize time</text><text x="390" y="440" font-size="18" fill="#526372">local slots → UTC</text><text x="390" y="468" font-size="18" fill="#526372">deduplicate; retain real gaps</text></g>
  <g id="stage3"><circle cx="780" cy="300" r="58" fill="#F26A2E"/><use data-icon="tabler-outline/shield-check" x="752" y="272" width="56" height="56" stroke="#FFFFFF" stroke-width="2" fill="none"/><text x="695" y="405" font-size="26" font-weight="700" fill="#103B5C">03 Quality gates</text><text x="695" y="440" font-size="18" fill="#526372">NaN / duplicates / range</text><text x="695" y="468" font-size="18" fill="#526372">30-minute continuity audit</text></g>
  <g id="stage4"><circle cx="1085" cy="300" r="58" fill="#2E7D5B"/><use data-icon="tabler-outline/stack" x="1057" y="272" width="56" height="56" stroke="#FFFFFF" stroke-width="2" fill="none"/><text x="995" y="405" font-size="26" font-weight="700" fill="#103B5C">04 Publish</text><text x="995" y="440" font-size="18" fill="#526372">float32 + datetime64</text><text x="995" y="468" font-size="18" fill="#526372">compressed NPZ + metadata</text></g>
 </g>
 <g id="facts" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="55" y="535" width="350" height="105" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="573" font-size="18" fill="#526372">Standard flow tensor</text><text x="80" y="615" font-size="28" font-weight="700" fill="#103B5C">22,484 × 2 × 32 × 32</text>
  <rect x="430" y="535" width="300" height="105" fill="#FFFFFF" stroke="#C9D5DF"/><text x="455" y="573" font-size="18" fill="#526372">Temporal resolution</text><text x="455" y="615" font-size="34" font-weight="700" fill="#F26A2E">30 minutes</text>
  <rect x="755" y="535" width="470" height="105" fill="#103B5C"/><text x="780" y="573" font-size="18" fill="#EAF0F5">Common training coordinates</text><text x="780" y="612" font-size="24" font-weight="700" fill="#FFFFFF">timestamp × node_id × channel</text>
 </g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="684" font-size="16" fill="#526372">The presentation uses anonymized city grids; the same schema and processing contract support transfer to an authorized business environment.</text></g>
</svg>
