<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="74" font-size="44" font-weight="700" fill="#103B5C">Final Graph: Spatial Prior + Adaptive Links</text><text x="1200" y="64" font-size="16" fill="#526372">13</text><text x="55" y="114" font-size="20" fill="#526372">Candidate graphs competed on matched windows; more edges and semantics did not automatically reduce error.</text></g>
 <g id="evidence" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="55" y="150" width="575" height="350" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="188" font-size="24" font-weight="700" fill="#103B5C">What did the four-graph checkpoint learn?</text>
  <g id="multigraph-weight-chart" font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="342" y="218" text-anchor="middle" font-size="16" fill="#526372">Global fusion weights at the best checkpoint (%)</text>
    <line x1="125" y1="420" x2="590" y2="420" stroke="#526372" stroke-width="1.5"/>
    <line x1="125" y1="383" x2="590" y2="383" stroke="#DDE5EC"/><line x1="125" y1="346" x2="590" y2="346" stroke="#DDE5EC"/>
    <line x1="125" y1="309" x2="590" y2="309" stroke="#DDE5EC"/><line x1="125" y1="272" x2="590" y2="272" stroke="#DDE5EC"/>
    <line x1="125" y1="235" x2="590" y2="235" stroke="#DDE5EC"/>
    <text x="115" y="425" text-anchor="end" font-size="16" fill="#526372">0</text><text x="115" y="388" text-anchor="end" font-size="16" fill="#526372">20</text>
    <text x="115" y="351" text-anchor="end" font-size="16" fill="#526372">40</text><text x="115" y="314" text-anchor="end" font-size="16" fill="#526372">60</text>
    <text x="115" y="277" text-anchor="end" font-size="16" fill="#526372">80</text><text x="115" y="240" text-anchor="end" font-size="16" fill="#526372">100</text>
    <rect x="155" y="406" width="65" height="14" fill="#2E7D5B"/><rect x="270" y="418" width="65" height="2" fill="#F26A2E"/>
    <rect x="385" y="249" width="65" height="171" fill="#103B5C"/><rect x="500" y="418" width="65" height="2" fill="#526372"/>
    <text x="188" y="398" text-anchor="middle" font-size="16" fill="#103B5C">7.37%</text><text x="303" y="409" text-anchor="middle" font-size="16" fill="#103B5C">0.42%</text>
    <text x="418" y="241" text-anchor="middle" font-size="16" fill="#103B5C">92.18%</text><text x="533" y="409" text-anchor="middle" font-size="16" fill="#103B5C">0.02%</text>
    <text x="188" y="443" text-anchor="middle" font-size="16" fill="#526372">Spatial</text><text x="303" y="443" text-anchor="middle" font-size="16" fill="#526372">POI</text>
    <text x="418" y="443" text-anchor="middle" font-size="16" fill="#526372">Flow</text><text x="533" y="443" text-anchor="middle" font-size="16" fill="#526372">Transit</text>
  </g>
  <text x="80" y="478" font-size="16" fill="#526372">Flow 92.18% · Spatial 7.37% · POI 0.42% · Transit 0.02%</text>
  <rect x="655" y="150" width="570" height="350" fill="#FFFFFF" stroke="#C9D5DF"/><text x="680" y="188" font-size="24" font-weight="700" fill="#103B5C">Why was multi-graph still rejected?</text><text x="680" y="225" font-size="18" fill="#526372">Single spatial gated AGFormer</text><text x="1165" y="255" text-anchor="end" font-size="28" font-weight="700" fill="#2E7D5B">MAE 16.5350</text><line x1="680" y1="270" x2="1195" y2="270" stroke="#DDE5EC"/><text x="680" y="300" font-size="18" fill="#526372">Four-graph global-weight fusion</text><text x="1165" y="330" text-anchor="end" font-size="28" font-weight="700" fill="#C73E3A">MAE 16.9569</text><text x="680" y="360" font-size="18" fill="#C73E3A">+0.4219 error, roughly 2.55% worse</text><text x="680" y="400" font-size="17" fill="#526372">1. One global logit vector cannot adapt by node/time.</text><text x="680" y="430" font-size="17" fill="#526372">2. Flow graph duplicates strong history information.</text><text x="680" y="460" font-size="17" fill="#526372">3. Sparse POI/transit gradients are easily dominated.</text>
 </g>
 <g id="final" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="55" y="530" width="1170" height="105" fill="#103B5C"/>
  <text x="80" y="565" font-size="20" font-weight="700" fill="#FFFFFF">Final spatial layer</text>
  <rect x="235" y="550" width="290" height="58" fill="#FFFFFF"/><text x="380" y="585" text-anchor="middle" font-size="18" font-weight="700" fill="#103B5C">G_spatial → DenseGCN</text>
  <text x="555" y="588" font-size="34" fill="#F26A2E">+</text>
  <rect x="600" y="550" width="400" height="58" fill="#FFFFFF"/><text x="800" y="575" text-anchor="middle" font-size="17" font-family="Consolas, Courier New, monospace" fill="#103B5C">A_adaptive = softmax(ReLU(E1E2ᵀ))</text><text x="800" y="598" text-anchor="middle" font-size="16" fill="#526372">node embeddings learn non-local relations</text>
  <text x="1030" y="588" font-size="34" fill="#F26A2E">→</text><text x="1080" y="585" font-size="20" font-weight="700" fill="#FFFFFF">sum + ReLU</text>
 </g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="680" font-size="16" fill="#526372">The 33-D node vector and graph edges are separate channels: one describes what a node is; the other controls message propagation.</text></g>
</svg>
