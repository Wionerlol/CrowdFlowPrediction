 <g id="tasks" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="265" font-size="18" fill="#17212B">Requirements &amp; papers</text><rect x="350" y="238" width="120" height="38" fill="#2A7F9E"/><text x="410" y="264" text-anchor="middle" font-size="18" fill="#FFFFFF">3 weeks</text><text x="55" y="335" font-size="18" fill="#17212B">Data, features, graphs, pipeline</text><rect x="430" y="308" width="160" height="38" fill="#103B5C"/><text x="510" y="334" text-anchor="middle" font-size="18" fill="#FFFFFF">4 weeks</text><text x="55" y="405" font-size="18" font-weight="700" fill="#17212B">Baselines, models, ablations, multi-seed</text><rect x="590" y="378" width="280" height="38" fill="#F26A2E"/><text x="730" y="404" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">7 weeks · core effort</text><text x="55" y="475" font-size="18" fill="#17212B">Anomaly fusion &amp; classification</text><rect x="870" y="448" width="120" height="38" fill="#2A7F9E"/><text x="930" y="474" text-anchor="middle" font-size="18" fill="#FFFFFF">3 weeks</text><text x="55" y="545" font-size="18" fill="#17212B">API, Web, XAI, performance, defense</text><rect x="990" y="518" width="120" height="38" fill="#2E7D5B"/><text x="1050" y="544" text-anchor="middle" font-size="18" fill="#FFFFFF">3 weeks</text></g>
 <g id="allocation" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="592" width="1160" height="82" fill="#EAF0F5"/><text x="78" y="624" font-size="18" font-weight="700" fill="#103B5C">Effort: data/features/graphs took four weeks; model development took seven weeks, 35% and the longest workstream.</text><text x="78" y="654" font-size="18" fill="#526372">Pacing: seven data slides for 3–4 minutes, then eleven model slides for 7–8 minutes focused on evidence and negative results.</text></g>
