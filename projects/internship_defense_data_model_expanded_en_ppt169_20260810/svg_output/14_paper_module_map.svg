<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="76" font-size="50" font-weight="700" fill="#103B5C">Paper-to-Project Module Map</text><text x="1165" y="64" font-size="16" fill="#526372">14</text><text x="55" y="116" font-size="18" fill="#526372">Mechanisms were transferred selectively; the original tasks and full architectures were not copied wholesale.</text></g>
 <g id="papers" font-family="Arial, Microsoft YaHei, sans-serif">
  <g id="stgcn"><rect x="55" y="140" width="570" height="225" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/paper_figures/stgcn_fig2_architecture.png" x="72" y="160" width="235" height="150" preserveAspectRatio="xMidYMid meet"/><text x="325" y="180" font-size="28" font-weight="700" fill="#103B5C">STGCN</text><text x="325" y="212" font-size="16" fill="#17212B">Used: explicit graph convolution and</text><text x="325" y="236" font-size="16" fill="#17212B">alternating spatiotemporal blocks</text><text x="325" y="270" font-size="16" fill="#526372">Changed: temporal conv → self-attention</text><text x="325" y="298" font-size="16" fill="#526372">Why: model the full 48-step history</text><text x="72" y="344" font-size="16" fill="#526372">Yu et al., IJCAI 2018, Fig. 2</text></g>
  <g id="gwn"><rect x="655" y="140" width="570" height="225" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/paper_figures/graph_wavenet_fig3_architecture.png" x="675" y="157" width="220" height="165" preserveAspectRatio="xMidYMid meet"/><text x="915" y="180" font-size="28" font-weight="700" fill="#103B5C">Graph WaveNet</text><text x="915" y="212" font-size="16" fill="#17212B">Used: node embeddings for</text><text x="915" y="236" font-size="16" fill="#17212B">adaptive adjacency</text><text x="915" y="270" font-size="16" fill="#526372">Kept: the known regular-grid graph</text><text x="915" y="298" font-size="16" fill="#526372">Goal: known + latent dependencies</text><text x="675" y="344" font-size="16" fill="#526372">Wu et al., IJCAI 2019, Fig. 3</text></g>
  <g id="transformer"><rect x="55" y="390" width="570" height="225" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/paper_figures/transformer_fig1_architecture.png" x="82" y="405" width="155" height="185" preserveAspectRatio="xMidYMid meet"/><text x="260" y="430" font-size="28" font-weight="700" fill="#103B5C">Transformer</text><text x="260" y="462" font-size="16" fill="#17212B">Used: attention, residuals, norm and FFN</text><text x="260" y="492" font-size="16" fill="#526372">Changed: encoder-style temporal path</text><text x="260" y="522" font-size="16" fill="#526372">Avoided: full decoder complexity</text><text x="260" y="552" font-size="16" fill="#526372">Role: long dependencies per node</text><text x="72" y="600" font-size="16" fill="#526372">Vaswani et al., NeurIPS 2017, Fig. 1</text></g>
  <g id="stf"><rect x="655" y="390" width="570" height="225" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/paper_figures/spacetimeformer_fig3_architecture.png" x="675" y="405" width="170" height="185" preserveAspectRatio="xMidYMid meet"/><text x="865" y="430" font-size="28" font-weight="700" fill="#F26A2E">Spacetimeformer</text><text x="865" y="462" font-size="16" fill="#17212B">Used: variable × time tokens and</text><text x="865" y="486" font-size="16" fill="#17212B">local/global attention</text><text x="865" y="516" font-size="16" fill="#526372">Aligned: value/time, given, target</text><text x="865" y="546" font-size="16" fill="#526372">Aligned: encoder-decoder cross-attention</text><text x="865" y="574" font-size="16" fill="#526372">Role: general-attention challenger</text><text x="675" y="600" font-size="16" fill="#526372">Grigsby et al., arXiv:2109.12218, Fig. 3</text></g>
 </g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="642" width="1170" height="48" fill="#103B5C"/><text x="640" y="673" text-anchor="middle" font-size="18" fill="#FFFFFF">AGFormer is a project-specific composition: papers supplied hypotheses; controlled experiments decided what stayed.</text></g>
</svg>
