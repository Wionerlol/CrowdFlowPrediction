<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#C9D5DF"/></marker></defs>
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="76" font-size="38" font-weight="700" fill="#103B5C">Spatial Lineage: Known Graph + Learned Links</text><text x="1200" y="64" font-size="16" fill="#526372">16</text></g>
 <g id="evidence" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="55" y="110" width="550" height="365" fill="#FFFFFF" stroke="#C9D5DF"/><text x="78" y="150" font-size="24" font-weight="700" fill="#103B5C">STGCN: local propagation on a known graph</text><image href="../images/paper_figures/stgcn_fig2_architecture.png" x="75" y="170" width="510" height="240" preserveAspectRatio="xMidYMid meet"/><text x="78" y="440" font-size="18" fill="#526372">Its T-GCN-T block injects adjacency W directly.</text><text x="78" y="463" font-size="16" fill="#526372">Source: Yu et al., IJCAI 2018, Fig. 2</text>
  <rect x="675" y="110" width="550" height="365" fill="#FFFFFF" stroke="#C9D5DF"/><text x="698" y="150" font-size="24" font-weight="700" fill="#103B5C">Graph WaveNet: latent links from data</text><image href="../images/paper_figures/graph_wavenet_fig3_architecture.png" x="700" y="165" width="500" height="245" preserveAspectRatio="xMidYMid meet"/><text x="698" y="440" font-size="18" fill="#526372">Node embeddings recover links omitted by the prior graph.</text><text x="698" y="463" font-size="16" fill="#526372">Source: Wu et al., IJCAI 2019, Fig. 3</text>
 </g>
 <g id="project" font-family="Arial, Microsoft YaHei, sans-serif"><path d="M330 480V515M950 480V515" stroke="#C9D5DF" stroke-width="4" marker-end="url(#a)"/><rect x="130" y="520" width="1020" height="120" fill="#103B5C"/><text x="165" y="560" font-size="30" font-weight="700" fill="#FFFFFF">AGFormer's spatial path</text><text x="165" y="600" font-size="22" fill="#EAF0F5">spatial GCN</text><text x="325" y="600" font-size="22" fill="#F26A2E">+</text><text x="365" y="600" font-size="22" fill="#EAF0F5">adaptive node-embedding graph</text><text x="735" y="600" font-size="22" fill="#F26A2E">→</text><text x="780" y="600" font-size="22" fill="#FFFFFF">fused prediction</text></g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="682" font-size="16" fill="#526372">Why it worked: the 32×32 grid has stable neighbors; the explicit graph narrows search while the adaptive graph adds non-local links.</text></g>
</svg>
