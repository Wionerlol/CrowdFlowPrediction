<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#C9D5DF"/></marker></defs>
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="76" font-size="38" font-weight="700" fill="#103B5C">Temporal Lineage: Transformer Core in AGFormer</text><text x="1200" y="64" font-size="16" fill="#526372">17</text></g>
 <g id="paper" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="112" width="400" height="490" fill="#FFFFFF" stroke="#C9D5DF"/><text x="78" y="152" font-size="26" font-weight="700" fill="#103B5C">Original encoder-decoder</text><image href="../images/paper_figures/transformer_fig1_architecture.png" x="110" y="170" width="290" height="360" preserveAspectRatio="xMidYMid meet"/><text x="78" y="570" font-size="16" fill="#526372">Vaswani et al., NeurIPS 2017, Fig. 1</text></g>
 <path d="M470 355H525" stroke="#C9D5DF" stroke-width="5" marker-end="url(#a)"/>
 <g id="project" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="540" y="112" width="685" height="490" fill="#FFFFFF" stroke="#C9D5DF"/><text x="570" y="152" font-size="26" font-weight="700" fill="#103B5C">Project: 48-step attention per node</text>
  <g id="tokens"><rect x="570" y="180" width="160" height="64" fill="#EAF0F5"/><text x="650" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#103B5C">Input token</text><text x="650" y="231" text-anchor="middle" font-size="16" fill="#526372">flow + context</text><path d="M730 212H770" stroke="#C9D5DF" stroke-width="4" marker-end="url(#a)"/><rect x="785" y="180" width="180" height="64" fill="#2A7F9E"/><text x="875" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4-head Self-Attn</text><path d="M965 212H1005" stroke="#C9D5DF" stroke-width="4" marker-end="url(#a)"/><rect x="1020" y="180" width="170" height="64" fill="#103B5C"/><text x="1105" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">FFN + Norm</text><text x="1105" y="231" text-anchor="middle" font-size="16" fill="#C9D5DF">2 layers</text></g>
  <line x1="570" y1="275" x2="1190" y2="275" stroke="#DDE5EC"/>
  <g id="kept"><text x="570" y="315" font-size="22" font-weight="700" fill="#2E7D5B">Mechanisms retained</text><text x="570" y="350" font-size="16" fill="#17212B">• Attention over 48 half-hour steps</text><text x="570" y="380" font-size="16" fill="#17212B">• Residuals, LayerNorm and FFN</text><text x="570" y="410" font-size="16" fill="#17212B">• Calendar and time encoding</text></g>
  <g id="changed"><text x="900" y="315" font-size="22" font-weight="700" fill="#F26A2E">Intentional simplification</text><text x="900" y="350" font-size="16" fill="#526372">• No language-style decoder</text><text x="900" y="380" font-size="16" fill="#526372">• Temporal/spatial paths split</text><text x="900" y="410" font-size="16" fill="#526372">• Direct 48-step projection</text></g>
  <rect x="570" y="455" width="620" height="105" fill="#EAF0F5"/><text x="595" y="493" font-size="24" font-weight="700" fill="#103B5C">Why this is not a literal Transformer copy</text><text x="595" y="525" font-size="16" fill="#526372">Attention models dependencies; the project structure also respects</text><text x="595" y="549" font-size="16" fill="#526372">graph topology, memory limits and 24-hour forecasting.</text>
 </g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="680" font-size="16" fill="#526372">Configuration: d_model=32, four heads, two layers; the final single model has about 0.052M parameters.</text></g>
</svg>
