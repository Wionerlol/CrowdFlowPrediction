<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#C9D5DF"/></marker></defs>
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="76" font-size="50" font-weight="700" fill="#103B5C">Five Evidence Gates to the Final Model</text><text x="1165" y="64" font-size="16" fill="#526372">15</text><text x="55" y="120" font-size="18" fill="#526372">Each step tested one question: spatial value, context injection, linear trend, or training variance.</text></g>
 <g id="flow" font-family="Arial, Microsoft YaHei, sans-serif">
  <path d="M257 325H293M489 325H525M721 325H757M953 325H989" stroke="#C9D5DF" stroke-width="5" marker-end="url(#arrow)"/>
  <g id="s1"><rect x="55" y="175" width="200" height="300" fill="#FFFFFF" stroke="#C9D5DF"/><text x="75" y="212" font-size="17" font-weight="700" fill="#526372">01 · Temporal baseline</text><text x="75" y="258" font-size="30" font-weight="700" fill="#103B5C">LSTM</text><text x="75" y="325" font-size="48" font-weight="700" fill="#17212B">19.4941</text><text x="75" y="355" font-size="16" fill="#526372">avg MAE · 3 seeds</text><line x1="75" y1="382" x2="235" y2="382" stroke="#DDE5EC"/><text x="75" y="415" font-size="18" fill="#526372">48-step history helps,</text><text x="75" y="443" font-size="18" fill="#526372">but no spatial flow.</text></g>
  <g id="s2"><rect x="287" y="175" width="200" height="300" fill="#FFFFFF" stroke="#2A7F9E" stroke-width="2"/><text x="307" y="212" font-size="17" font-weight="700" fill="#526372">02 · Add spatial prior</text><text x="307" y="250" font-size="26" font-weight="700" fill="#103B5C">AGFormer</text><text x="307" y="280" font-size="18" fill="#526372">Time + Static</text><text x="307" y="325" font-size="48" font-weight="700" fill="#2A7F9E">16.9376</text><text x="307" y="355" font-size="16" fill="#526372">avg MAE · 3 seeds</text><line x1="307" y1="382" x2="467" y2="382" stroke="#DDE5EC"/><text x="307" y="415" font-size="18" fill="#526372">Explicit + adaptive</text><text x="307" y="443" font-size="18" fill="#526372">graphs beat temporal-only.</text></g>
  <g id="s3"><rect x="519" y="175" width="200" height="300" fill="#FFFFFF" stroke="#2A7F9E" stroke-width="2"/><text x="539" y="212" font-size="17" font-weight="700" fill="#526372">03 · Gate context</text><text x="539" y="258" font-size="28" font-weight="700" fill="#103B5C">Gated</text><text x="539" y="325" font-size="48" font-weight="700" fill="#2A7F9E">16.5350</text><text x="539" y="355" font-size="16" fill="#526372">avg MAE · seed42</text><line x1="539" y1="382" x2="699" y2="382" stroke="#DDE5EC"/><text x="539" y="415" font-size="18" fill="#526372">Scale time/static by</text><text x="539" y="443" font-size="18" fill="#526372">the current flow state.</text></g>
  <g id="s4"><rect x="751" y="175" width="200" height="300" fill="#FFFFFF" stroke="#F26A2E" stroke-width="3"/><text x="771" y="212" font-size="17" font-weight="700" fill="#526372">04 · Linear residual</text><text x="771" y="250" font-size="25" font-weight="700" fill="#103B5C">Gated + Linear</text><text x="771" y="325" font-size="48" font-weight="700" fill="#F26A2E">16.1132</text><text x="771" y="355" font-size="16" fill="#526372">avg MAE · seed42</text><line x1="771" y1="382" x2="931" y2="382" stroke="#DDE5EC"/><text x="771" y="415" font-size="18" fill="#526372">Linear trend +</text><text x="771" y="443" font-size="18" fill="#526372">nonlinear correction.</text></g>
  <g id="s5"><rect x="983" y="175" width="242" height="300" fill="#103B5C"/><text x="1005" y="212" font-size="17" font-weight="700" fill="#C9D5DF">05 · Reduce variance</text><text x="1005" y="250" font-size="25" font-weight="700" fill="#FFFFFF">4-seed Ensemble</text><text x="1005" y="325" font-size="52" font-weight="700" fill="#F26A2E">15.9030</text><text x="1005" y="355" font-size="16" fill="#FFFFFF">avg MAE · 4,022 windows</text><line x1="1005" y1="382" x2="1200" y2="382" stroke="#2A7F9E"/><text x="1005" y="415" font-size="18" fill="#EAF0F5">Prediction averaging</text><text x="1005" y="443" font-size="18" fill="#EAF0F5">reduces MAE and MAPE.</text></g>
 </g>
 <g id="notes" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="515" width="1170" height="115" fill="#EAF0F5"/><text x="78" y="552" font-size="22" font-weight="700" fill="#103B5C">How to read the staircase</text><text x="78" y="586" font-size="18" fill="#526372">The first two are three-seed metric means; the next two are seed42 models; the last averages predictions across four models.</text><text x="78" y="615" font-size="18" fill="#526372">It documents the R&amp;D path, while strict claims use matched seeds/windows or independent multi-seed checks.</text></g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="683" font-size="16" fill="#526372">Final gain: ensemble MAE is 3.82% below the original gated baseline.</text></g>
</svg>
