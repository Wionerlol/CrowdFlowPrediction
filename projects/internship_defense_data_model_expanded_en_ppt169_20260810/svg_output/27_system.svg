<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g><g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="78" font-size="56" font-weight="700" fill="#103B5C">System Delivery: Pipeline → API → Map → Tiered Alerts</text><text x="1165" y="64" font-size="16" fill="#526372">27</text></g><g id="architecture" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="120" width="650" height="95" fill="#EAF0F5"/><use data-icon="tabler-outline/route" x="75" y="142" width="46" height="46" stroke="#2A7F9E" stroke-width="2" fill="none"/><text x="145" y="160" font-size="34" font-weight="700" fill="#103B5C">Batch / realtime micro-batch</text><text x="145" y="195" font-size="18" fill="#526372">preprocess, features, ensemble inference, anomaly fusion</text><rect x="55" y="235" width="650" height="95" fill="#FFFFFF" stroke="#C9D5DF"/><use data-icon="tabler-outline/api" x="75" y="257" width="46" height="46" stroke="#2A7F9E" stroke-width="2" fill="none"/><text x="145" y="275" font-size="34" font-weight="700" fill="#103B5C">FastAPI service</text><text x="145" y="310" font-size="18" fill="#526372">heatmap, 24h forecast, events, region/time queries</text><rect x="55" y="350" width="650" height="95" fill="#FFFFFF" stroke="#C9D5DF"/><use data-icon="tabler-outline/device-desktop" x="75" y="372" width="46" height="46" stroke="#2A7F9E" stroke-width="2" fill="none"/><text x="145" y="390" font-size="34" font-weight="700" fill="#103B5C">Streamlit map Web</text><text x="145" y="425" font-size="18" fill="#526372">live heatmap, forecast animation, event details and history</text><rect x="55" y="465" width="650" height="130" fill="#103B5C"/><use data-icon="tabler-outline/alert-triangle" x="75" y="493" width="52" height="52" stroke="#F26A2E" stroke-width="2" fill="none"/><text x="145" y="505" font-size="34" font-weight="700" fill="#FFFFFF">Three alert tiers</text><text x="145" y="548" font-size="32" fill="#FFFFFF">General 110 · Important 15 · Urgent 6</text><text x="145" y="580" font-size="18" fill="#C9D5DF">Important: popup · Urgent: popup + sound</text></g><g id="evidence" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="735" y="120" width="215" height="285" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/week6_web_screenshot.png" x="748" y="132" width="189" height="260" preserveAspectRatio="xMidYMid meet"/><text x="842" y="430" text-anchor="middle" font-size="18" fill="#526372">Current Web prototype</text><rect x="975" y="120" width="250" height="285" fill="#EAF0F5" stroke="#2A7F9E" stroke-width="2" stroke-dasharray="10 7"/><use data-icon="tabler-outline/device-desktop" x="1067" y="190" width="66" height="66" stroke="#2A7F9E" stroke-width="2" fill="none"/><text x="1100" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#103B5C"><tspan x="1100">Replace with latest home /</tspan><tspan x="1100" dy="30">tiered-alert screenshot</tspan></text><rect x="735" y="465" width="490" height="130" fill="#FFFFFF" stroke="#F26A2E" stroke-width="2" stroke-dasharray="10 7"/><text x="980" y="520" text-anchor="middle" font-size="34" font-weight="700" fill="#F26A2E">Short Web demo video</text><text x="980" y="560" text-anchor="middle" font-size="18" fill="#526372">Insert a 20–30 second map interaction recording</text></g><g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="660" font-size="18" fill="#526372">All 131 events are map-locatable: 108 main centroids + 23 top-cell fallbacks.</text></g></svg>
