<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="74" font-size="40" font-weight="700" fill="#103B5C">Final Input Contract: Dynamic 9D + Static 33D</text><text x="1200" y="64" font-size="16" fill="#526372">11</text><text x="55" y="114" font-size="20" fill="#526372">Being engineered does not mean being used: column selection, broadcasting and scaling are fixed in configuration.</text></g>
 <g id="flow" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="55" y="165" width="260" height="135" fill="#103B5C"/><text x="80" y="205" font-size="24" font-weight="700" fill="#FFFFFF">Flow history · 2D</text><text x="80" y="242" font-size="18" fill="#EAF0F5">inflow + outflow</text><text x="80" y="275" font-size="18" fill="#FFFFFF">(B, N, 48, 2)</text>
  <path d="M315 232H390" stroke="#C9D5DF" stroke-width="4"/><path d="M375 222L390 232L375 242" fill="none" stroke="#C9D5DF" stroke-width="4"/>
  <rect x="390" y="165" width="300" height="135" fill="#2A7F9E"/><text x="415" y="205" font-size="24" font-weight="700" fill="#FFFFFF">True time/calendar · 7D</text><text x="415" y="238" font-size="16" fill="#EAF0F5">slot sin/cos · weekday sin/cos</text><text x="415" y="265" font-size="16" fill="#EAF0F5">weekend · holiday · workday</text><text x="655" y="289" text-anchor="end" font-size="16" fill="#FFFFFF">broadcast to every node</text>
  <path d="M690 232H765" stroke="#C9D5DF" stroke-width="4"/><path d="M750 222L765 232L750 242" fill="none" stroke="#C9D5DF" stroke-width="4"/>
  <rect x="765" y="165" width="220" height="135" fill="#FFFFFF" stroke="#F26A2E" stroke-width="3"/><text x="790" y="205" font-size="24" font-weight="700" fill="#103B5C">Dynamic input · 9D</text><text x="790" y="245" font-size="18" fill="#526372">per node and time</text><text x="790" y="278" font-size="18" font-weight="700" fill="#F26A2E">F_in = 2 + 7 = 9</text>
  <path d="M985 232H1060" stroke="#C9D5DF" stroke-width="4"/><path d="M1045 222L1060 232L1045 242" fill="none" stroke="#C9D5DF" stroke-width="4"/>
  <rect x="1060" y="165" width="165" height="135" fill="#2E7D5B"/><text x="1142" y="210" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">48-step future</text><text x="1142" y="248" text-anchor="middle" font-size="18" fill="#EAF0F5">predict inflow</text><text x="1142" y="278" text-anchor="middle" font-size="16" fill="#FFFFFF">(B,N,48)</text>
 </g>
 <g id="static_audit" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="55" y="345" width="550" height="205" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="385" font-size="26" font-weight="700" fill="#103B5C">41 → 33: leakage audit</text><rect x="80" y="415" width="200" height="65" fill="#EAF0F5"/><text x="180" y="457" text-anchor="middle" font-size="28" font-weight="700" fill="#2A7F9E">41 candidates</text><path d="M290 447H360" stroke="#C73E3A" stroke-width="4"/><path d="M345 437L360 447L345 457" fill="none" stroke="#C73E3A" stroke-width="4"/><rect x="370" y="415" width="200" height="65" fill="#103B5C"/><text x="470" y="457" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">33 retained</text><text x="80" y="515" font-size="17" fill="#C73E3A">Drop [27:35]: eight whole-series flow profiles</text><text x="80" y="540" font-size="16" fill="#526372">Keep geography, roads, POIs, EO, stops and routes.</text>
  <rect x="635" y="345" width="590" height="205" fill="#FFFFFF" stroke="#C9D5DF"/><text x="660" y="385" font-size="26" font-weight="700" fill="#103B5C">How context enters AGFormer</text><text x="660" y="425" font-size="18" fill="#526372">flow → Linear(2, d_model)</text><text x="660" y="455" font-size="18" fill="#526372">time → LayerNorm + Linear(7, d_model)</text><text x="660" y="485" font-size="18" fill="#526372">static → LayerNorm + Linear(33, d_model)</text><rect x="930" y="415" width="260" height="92" fill="#103B5C"/><text x="1060" y="451" text-anchor="middle" font-size="18" fill="#EAF0F5">gate = σ([flow, context])</text><text x="1060" y="482" text-anchor="middle" font-size="18" fill="#FFFFFF">h = flow + gate ⊙ context</text><text x="660" y="530" font-size="16" fill="#2E7D5B">Gating varies context by node and period.</text>
 </g>
 <g id="candidates" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="580" width="1170" height="72" fill="#EAF0F5"/><text x="80" y="611" font-size="18" font-weight="700" fill="#103B5C">Excluded:</text><text x="185" y="611" font-size="17" fill="#17212B">12 weather fields aligned at 22,484/22,484 timestamps but gave no stable gain; periodic lags also reduced valid windows.</text><text x="80" y="640" font-size="16" fill="#526372">The scaler mean/std is fitted on train and reused unchanged for validation and test.</text></g>
</svg>
