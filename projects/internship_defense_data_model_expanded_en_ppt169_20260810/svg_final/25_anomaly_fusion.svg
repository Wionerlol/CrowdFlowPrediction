<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C9D5DF" /></marker></defs><g id="background"><rect width="1280" height="720" fill="#F7FAFC" /></g><g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="78" font-size="56" font-weight="700" fill="#103B5C">Three-Way Anomaly Fusion</text><text x="1165" y="64" font-size="16" fill="#526372">25</text><text x="55" y="126" font-size="36" fill="#17212B">Complementary evidence becomes a mergeable, classifiable event.</text></g><g id="branches" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="190" width="280" height="165" fill="#FFFFFF" stroke="#2A7F9E" stroke-width="3" /><text x="80" y="235" font-size="34" font-weight="700" fill="#103B5C">Statistical</text><text x="80" y="282" font-size="32" fill="#17212B">3σ + IQR</text><text x="80" y="320" font-size="18" fill="#526372">node × time-slot range</text><rect x="55" y="385" width="280" height="165" fill="#FFFFFF" stroke="#2A7F9E" stroke-width="3" /><text x="80" y="430" font-size="34" font-weight="700" fill="#103B5C">Reconstruction</text><text x="80" y="477" font-size="32" fill="#17212B">VAE + Transformer AE</text><text x="80" y="515" font-size="18" fill="#526372">weak-normal windows only</text><rect x="55" y="580" width="280" height="95" fill="#FFFFFF" stroke="#2A7F9E" stroke-width="3" /><text x="80" y="625" font-size="34" font-weight="700" fill="#103B5C">Prediction error</text><text x="80" y="657" font-size="18" fill="#526372">AGFormer ensemble residual</text></g><g id="connectors" stroke="#C9D5DF" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M335 272H470V385" /><path d="M335 467H470V410" /><path d="M335 628H470V435" /><line x1="695" y1="410" x2="790" y2="410" /><line x1="990" y1="410" x2="1060" y2="410" /></g><g id="fusion" font-family="Arial, Microsoft YaHei, sans-serif"><path d="M580 290L705 410L580 530L455 410Z" fill="#F26A2E" /><text x="580" y="382" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">Weighted fusion</text><text x="580" y="425" text-anchor="middle" font-size="18" fill="#FFFFFF">0.70 / 0.20 / 0.10</text><text x="580" y="458" text-anchor="middle" font-size="18" fill="#FFFFFF">threshold 0.56</text></g><g id="event" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="790" y="300" width="200" height="220" fill="#103B5C" /><text x="890" y="355" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">Event builder</text><text text-anchor="middle" fill="#EAF0F5" font-size="18" x="890" y="405">time continuity</text><text text-anchor="middle" fill="#EAF0F5" font-size="18" x="890" y="437">spatial IoU / centroid</text><text text-anchor="middle" fill="#EAF0F5" font-size="18" x="890" y="469">main-region overlap</text></g><g id="classification" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="1060" y="300" width="165" height="220" fill="#2E7D5B" /><text x="1142" y="355" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">Output</text><text text-anchor="middle" fill="#FFFFFF" font-size="18" x="1142" y="405">event type</text><text text-anchor="middle" fill="#FFFFFF" font-size="18" x="1142" y="437">severity tier</text><text text-anchor="middle" fill="#FFFFFF" font-size="18" x="1142" y="469">evidence fields</text></g><g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="395" y="650" font-size="18" fill="#526372">Validation selects the weights and threshold; space and time turn detections into events.</text></g></svg>