<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="76" font-size="44" font-weight="700" fill="#103B5C">Temporal Continuity: Never Bridge Real Gaps</text><text x="1200" y="64" font-size="16" fill="#526372">08</text><text x="55" y="118" font-size="21" fill="#526372">A later audit found 73 discontinuities; every 96-step sample must contain 95 consecutive 30-minute edges.</text></g>
 <g id="timeline" font-family="Arial, Microsoft YaHei, sans-serif">
  <text x="55" y="190" font-size="24" font-weight="700" fill="#C73E3A">Incorrect</text><line x1="205" y1="182" x2="1190" y2="182" stroke="#C9D5DF" stroke-width="6"/><line x1="250" y1="182" x2="505" y2="182" stroke="#C73E3A" stroke-width="8"/><line x1="780" y1="182" x2="1080" y2="182" stroke="#C73E3A" stroke-width="8"/><path d="M505 182 C600 105 690 255 780 182" fill="none" stroke="#C73E3A" stroke-width="5" stroke-dasharray="11 8"/><text x="640" y="158" text-anchor="middle" font-size="18" fill="#C73E3A">adjacent arrays ≠ adjacent timestamps</text>
  <text x="55" y="290" font-size="24" font-weight="700" fill="#2E7D5B">Final rule</text><line x1="205" y1="282" x2="505" y2="282" stroke="#2A7F9E" stroke-width="8"/><line x1="780" y1="282" x2="1080" y2="282" stroke="#2A7F9E" stroke-width="8"/><path d="M620 250L650 282L620 314M690 250L660 282L690 314" fill="none" stroke="#2E7D5B" stroke-width="5"/><text x="640" y="340" text-anchor="middle" font-size="18" fill="#526372">stop windows at gaps; do not globally interpolate seasons</text>
 </g>
 <g id="gates" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="55" y="390" width="360" height="190" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="428" font-size="24" font-weight="700" fill="#103B5C">True timestamps</text><text x="80" y="464" font-size="18" fill="#526372">YYYYMMDDSS → local slot</text><text x="80" y="493" font-size="18" fill="#526372">→ UTC datetime64[s]</text><text x="80" y="535" font-size="18" fill="#2E7D5B">prevents weekday drift from index math</text>
  <rect x="460" y="390" width="360" height="190" fill="#FFFFFF" stroke="#C9D5DF"/><text x="485" y="428" font-size="24" font-weight="700" fill="#103B5C">Chronological split</text><text x="485" y="464" font-size="18" fill="#526372">train / val / test = 7 : 1 : 2</text><text x="485" y="493" font-size="18" fill="#526372">mean / std fitted on train only</text><text x="485" y="535" font-size="18" fill="#2E7D5B">4,022 final test windows</text>
  <rect x="865" y="390" width="360" height="190" fill="#103B5C"/><text x="890" y="428" font-size="24" font-weight="700" fill="#FFFFFF">Outlier boundary</text><text x="890" y="464" font-size="18" fill="#EAF0F5">early cleaning interpolated |z| &gt; 5</text><text x="890" y="493" font-size="18" fill="#EAF0F5">forecasting uses the cleaned series</text><text x="890" y="535" font-size="18" fill="#F26A2E">production anomaly use needs a raw mirror</text>
 </g>
 <g id="takeaway" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="610" width="1170" height="58" fill="#EAF0F5"/><text x="80" y="647" font-size="20" font-weight="700" fill="#103B5C">Key upgrade:</text><text x="245" y="647" font-size="18" fill="#17212B">continuity moved from a report assumption into a hard check inside every Dataset window.</text></g>
</svg>
