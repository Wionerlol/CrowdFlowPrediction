<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><g id="background"><rect width="1280" height="720" fill="#F7FAFC" /></g><g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="82" font-size="56" font-weight="700" fill="#103B5C">Gap-Aware Windows, Chronological Splits, No Leakage</text><text x="1165" y="65" font-size="16" fill="#526372">08</text><text x="55" y="132" font-size="36" fill="#17212B">The critical risk was false continuity, not simply missing values.</text></g><g id="before" font-family="Arial, Microsoft YaHei, sans-serif"><text x="65" y="225" font-size="34" font-weight="700" fill="#C73E3A">Wrong merge</text><line x1="245" y1="215" x2="1140" y2="215" stroke="#C9D5DF" stroke-width="6" /><g fill="#C73E3A"><circle cx="300" cy="215" r="11" /><circle cx="390" cy="215" r="11" /><circle cx="480" cy="215" r="11" /><circle cx="830" cy="215" r="11" /><circle cx="920" cy="215" r="11" /></g><path d="M480 215C590 160 720 270 830 215" fill="none" stroke="#C73E3A" stroke-width="5" stroke-dasharray="10 8" /><text x="655" y="185" font-size="18" fill="#C73E3A">fake window across a gap</text></g><g id="after" font-family="Arial, Microsoft YaHei, sans-serif"><text x="65" y="335" font-size="34" font-weight="700" fill="#2E7D5B">True sequence</text><line x1="245" y1="325" x2="540" y2="325" stroke="#2A7F9E" stroke-width="6" /><line x1="790" y1="325" x2="1140" y2="325" stroke="#2A7F9E" stroke-width="6" /><g fill="#2E7D5B"><circle cx="300" cy="325" r="11" /><circle cx="390" cy="325" r="11" /><circle cx="480" cy="325" r="11" /><circle cx="830" cy="325" r="11" /><circle cx="920" cy="325" r="11" /></g><text x="635" y="335" font-size="18" fill="#526372">window stops at the gap</text></g><g id="gates" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="60" y="420" width="350" height="160" fill="#FFFFFF" stroke="#C9D5DF" /><text x="85" y="465" font-size="34" font-weight="700" fill="#103B5C">01 Time rules</text><text fill="#526372" font-size="18" x="85" y="515">real timestamps + gap filter</text><text fill="#526372" font-size="18" x="85" y="547">48 history → 48 future</text><rect x="465" y="420" width="350" height="160" fill="#FFFFFF" stroke="#C9D5DF" /><text x="490" y="465" font-size="34" font-weight="700" fill="#103B5C">02 Split rules</text><text fill="#526372" font-size="18" x="490" y="515">train / val / test = 7:1:2</text><text fill="#526372" font-size="18" x="490" y="547">chronological, never shuffled</text><rect x="870" y="420" width="350" height="160" fill="#103B5C" /><text x="895" y="465" font-size="34" font-weight="700" fill="#FFFFFF">03 Leakage gate</text><text fill="#EAF0F5" font-size="18" x="895" y="515">scaler fitted on training only</text><text fill="#EAF0F5" font-size="18" x="895" y="547">4,022 valid test windows</text></g><g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="60" y="650" font-size="18" fill="#526372">Checkpoints retain configuration, data rules and scaling metadata to prevent stale-model reuse.</text></g></svg>