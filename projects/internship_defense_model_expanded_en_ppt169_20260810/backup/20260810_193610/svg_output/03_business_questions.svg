<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/><rect width="1280" height="12" fill="#F26A2E"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="58" y="88" font-size="56" font-weight="700" fill="#103B5C">Ride-hailing Safety Requires Anticipate–Detect–Respond</text><text x="1160" y="70" font-size="16" fill="#526372">03</text></g>
 <g id="role" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="58" y="145" width="395" height="475" fill="#103B5C"/><use data-icon="tabler-outline/shield-check" x="92" y="185" width="70" height="70" stroke="#F26A2E" stroke-width="2" fill="none"/><text x="92" y="310" font-size="34" font-weight="700" fill="#FFFFFF">Internship role</text><text x="92" y="365" font-size="32" fill="#EAF0F5"><tspan x="92">Ride-hailing Safety</tspan><tspan x="92" dy="48">Algorithm Intern</tspan></text><line x1="92" y1="482" x2="390" y2="482" stroke="#2A7F9E" stroke-width="2"/><text x="92" y="530" font-size="18" fill="#C9D5DF"><tspan x="92">The goal is not one prediction,</tspan><tspan x="92" dy="30">but an actionable safety event.</tspan></text></g>
 <g id="decision-chain" font-family="Arial, Microsoft YaHei, sans-serif"><path d="M605 260V515" stroke="#C9D5DF" stroke-width="3"/><circle cx="605" cy="240" r="16" fill="#F26A2E"/><circle cx="605" cy="380" r="16" fill="#2A7F9E"/><circle cx="605" cy="520" r="16" fill="#103B5C"/><text x="655" y="220" font-size="34" font-weight="700" fill="#F26A2E">Anticipate</text><text x="655" y="263" font-size="32" fill="#17212B">How will each region change over 24h?</text><text x="655" y="360" font-size="34" font-weight="700" fill="#2A7F9E">Detect</text><text x="655" y="403" font-size="32" fill="#17212B">Which deviations exceed normal behavior?</text><text x="655" y="500" font-size="34" font-weight="700" fill="#103B5C">Respond</text><text x="655" y="543" font-size="32" fill="#17212B">What type and alert tier should be triggered?</text></g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="58" y="680" font-size="18" fill="#526372">Region × time × anomaly type × response action</text></g>
</svg>
