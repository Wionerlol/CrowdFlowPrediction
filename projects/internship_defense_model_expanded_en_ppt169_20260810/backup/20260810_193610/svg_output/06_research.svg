<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g><g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="82" font-size="56" font-weight="700" fill="#103B5C">From Spatiotemporal Graphs to Transformers</text><text x="1160" y="65" font-size="16" fill="#526372">06</text><text x="55" y="132" font-size="36" fill="#17212B">Literature shaped a testable combination of spatial priors, long context and anomaly learning.</text></g><g id="timeline" font-family="Arial, Microsoft YaHei, sans-serif"><line x1="90" y1="330" x2="1190" y2="330" stroke="#C9D5DF" stroke-width="4"/><circle cx="125" cy="330" r="16" fill="#2A7F9E"/><text x="125" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#103B5C">GCN</text><text x="125" y="380" text-anchor="middle" font-size="18" fill="#526372">graph propagation</text><circle cx="315" cy="330" r="16" fill="#2A7F9E"/><text x="315" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#103B5C">STGCN</text><text x="315" y="380" text-anchor="middle" font-size="18" fill="#526372">space + time</text><circle cx="505" cy="330" r="16" fill="#2A7F9E"/><text x="505" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#103B5C">Transformer</text><text x="505" y="380" text-anchor="middle" font-size="18" fill="#526372">global context</text><circle cx="695" cy="330" r="16" fill="#2A7F9E"/><text x="695" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#103B5C">Graph WaveNet</text><text x="695" y="380" text-anchor="middle" font-size="18" fill="#526372">adaptive graph</text><circle cx="900" cy="330" r="16" fill="#F26A2E"/><text x="900" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#F26A2E">Spacetimeformer</text><text x="900" y="380" text-anchor="middle" font-size="18" fill="#526372">variable × time tokens</text><circle cx="1120" cy="330" r="16" fill="#2E7D5B"/><text x="1120" y="270" text-anchor="middle" font-size="34" font-weight="700" fill="#103B5C">VAE / SHAP</text><text x="1120" y="380" text-anchor="middle" font-size="18" fill="#526372">detect &amp; explain</text></g><g id="decision" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="468" width="1170" height="150" fill="#103B5C"/><use data-icon="tabler-outline/file-analytics" x="85" y="500" width="58" height="58" stroke="#F26A2E" stroke-width="2" fill="none"/><text x="170" y="520" font-size="34" font-weight="700" fill="#FFFFFF">Project decision</text><text x="170" y="570" font-size="32" fill="#EAF0F5">Explicit graph + adaptive graph + temporal attention + three-way fusion</text><text x="170" y="605" font-size="18" fill="#C9D5DF">AGFormer is project-specific; it is not claimed as an external paper reproduction.</text></g></svg>
