<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g><g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="78" font-size="56" font-weight="700" fill="#103B5C">Architecture Selection: Task Priors Beat Generic Global Attention</text><text x="1165" y="64" font-size="16" fill="#526372">11</text></g><g id="chart"><rect x="55" y="115" width="1170" height="350" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/fig3_2_spacetimeformer_ablation.png" x="75" y="135" width="1130" height="310" preserveAspectRatio="xMidYMid meet"/></g><g id="analysis" font-family="Arial, Microsoft YaHei, sans-serif"><text x="60" y="520" font-size="34" font-weight="700" fill="#2A7F9E">Expected</text><text x="60" y="563" font-size="18" fill="#526372"><tspan x="60">local/global attention</tspan><tspan x="60" dy="29">captures cross-variable context</tspan></text><path d="M315 548H380" stroke="#C9D5DF" stroke-width="4"/><text x="405" y="520" font-size="34" font-weight="700" fill="#F26A2E">Observed</text><text x="405" y="563" font-size="18" fill="#526372"><tspan x="405">aligned embedding and cross-attention</tspan><tspan x="405" dy="29">still remained behind</tspan></text><path d="M675 548H740" stroke="#C9D5DF" stroke-width="4"/><text x="765" y="520" font-size="34" font-weight="700" fill="#103B5C">Explained</text><text x="765" y="563" font-size="18" fill="#526372"><tspan x="765">1024 × 48 tokens require approximation;</tspan><tspan x="765" dy="29">regular grids reward explicit graph priors</tspan></text></g><g id="conclusion" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="630" width="1170" height="54" fill="#103B5C"/><text x="640" y="665" text-anchor="middle" font-size="18" fill="#FFFFFF">The lesson is not “Transformers fail,” but that inductive bias, scale and data volume must match.</text></g></svg>
