 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="76" font-size="50" font-weight="700" fill="#103B5C">Multi-Seed Replication and Ensemble</text><text x="1165" y="64" font-size="16" fill="#526372">20</text></g>
 <g id="charts"><rect x="55" y="110" width="560" height="350" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="148" font-size="24" font-weight="700" fill="#103B5C" font-family="Arial, Microsoft YaHei, sans-serif">Four independently trained seeds</text><image href="../images/fig4_2_linear_multiseed.png" x="75" y="165" width="520" height="275" preserveAspectRatio="xMidYMid meet"/>
 <rect x="645" y="110" width="580" height="350" fill="#FFFFFF" stroke="#C9D5DF"/><text x="670" y="148" font-size="24" font-weight="700" fill="#103B5C" font-family="Arial, Microsoft YaHei, sans-serif">Ensemble error across forecast horizons</text><image href="../images/fig5_1_ensemble_horizon.png" x="665" y="165" width="540" height="275" preserveAspectRatio="xMidYMid meet"/></g>
 <g id="summary" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="55" y="490" width="270" height="145" fill="#FFFFFF" stroke="#C9D5DF"/><text x="78" y="525" font-size="18" fill="#526372">Best single model: seed42</text><text x="78" y="580" font-size="48" font-weight="700" fill="#103B5C">16.1132</text><text x="78" y="615" font-size="16" fill="#526372">lowest single-model MAE</text>
  <rect x="345" y="490" width="280" height="145" fill="#FFFFFF" stroke="#C9D5DF"/><text x="368" y="525" font-size="18" fill="#526372">Four-seed model mean</text><text x="368" y="575" font-size="38" font-weight="700" fill="#2A7F9E">16.4961</text><text x="368" y="610" font-size="18" fill="#526372">± 0.2850</text>
  <rect x="645" y="490" width="300" height="145" fill="#103B5C"/><text x="670" y="525" font-size="18" fill="#C9D5DF">Prediction-level mean</text><text x="670" y="580" font-size="50" font-weight="700" fill="#F26A2E">15.9030</text><text x="670" y="615" font-size="16" fill="#FFFFFF">MAE · RMSE 30.2250</text>
  <rect x="965" y="490" width="260" height="145" fill="#EAF0F5"/><text x="988" y="525" font-size="20" font-weight="700" fill="#103B5C">Deployment trade-off</text><text x="988" y="560" font-size="18" fill="#526372">Offline detection: 4 models</text><text x="988" y="590" font-size="18" fill="#526372">Real-time API: seed42</text><text x="988" y="620" font-size="16" fill="#C97A11">roughly 4× forward cost</text>
 </g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="682" font-size="16" fill="#526372">h1 / h3 / h6 / h12 MAE: 11.3019 / 12.6473 / 13.4194 / 14.1068; full 24-hour average: 15.9030.</text></g>
