<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="76" font-size="42" font-weight="700" fill="#103B5C">Context Gating vs. Feature Overload</text><text x="1165" y="64" font-size="16" fill="#526372">17</text></g>
 <g id="chart"><rect x="55" y="110" width="730" height="420" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/fig3_3_feature_ablation.png" x="75" y="130" width="690" height="380" preserveAspectRatio="xMidYMid meet"/></g>
 <g id="findings" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="815" y="110" width="410" height="125" fill="#103B5C"/><text x="840" y="146" font-size="22" font-weight="700" fill="#FFFFFF">Why did gating help?</text><text x="840" y="178" font-size="16" fill="#EAF0F5">Time and static signals are not equally useful</text><text x="840" y="202" font-size="16" fill="#EAF0F5">for every node and period.</text><text x="840" y="228" font-size="16" fill="#F26A2E">gate(flow) makes their effect conditional.</text>
  <rect x="815" y="250" width="410" height="125" fill="#FFFFFF" stroke="#C9D5DF"/><text x="840" y="286" font-size="22" font-weight="700" fill="#103B5C">Why did the repaired calendar hurt?</text><text x="840" y="318" font-size="16" fill="#526372">Fixing shifted workdays removed the earlier</text><text x="840" y="342" font-size="16" fill="#526372">apparent gain.</text><text x="840" y="368" font-size="16" fill="#C97A11">MAE 17.8542 vs gated 16.5350.</text>
  <rect x="815" y="390" width="410" height="140" fill="#FFFFFF" stroke="#C9D5DF"/><text x="840" y="426" font-size="22" font-weight="700" fill="#103B5C">Why was weather marginal?</text><text x="840" y="458" font-size="16" fill="#526372">Calendar + Weather: 17.8316, only 0.0226 better.</text><text x="840" y="484" font-size="16" fill="#526372">Effects are sparse and spatially heterogeneous;</text><text x="840" y="510" font-size="16" fill="#526372">strong flow history absorbs part of the signal.</text>
 </g>
 <g id="decision" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="560" width="1170" height="92" fill="#EAF0F5"/><text x="78" y="596" font-size="22" font-weight="700" fill="#103B5C">Retention decision</text><text x="330" y="596" font-size="16" fill="#17212B">Keep seven time and 33 leakage-free static features, but inject them through gates.</text><text x="78" y="628" font-size="16" fill="#526372">Weather was excluded because no stable gain survived the corrected data rules.</text></g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="688" font-size="16" fill="#526372">Feature engineering also means correcting rules, matching windows and removing inputs without reproducible value.</text></g>
</svg>
