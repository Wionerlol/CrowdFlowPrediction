<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="76" font-size="50" font-weight="700" fill="#103B5C">A Useful Module From a Failed Model</text><text x="1165" y="64" font-size="16" fill="#526372">19</text></g>
 <g id="formula" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="110" width="1170" height="88" fill="#103B5C"/><text x="640" y="150" text-anchor="middle" font-size="30" font-family="Consolas, Courier New, monospace" fill="#FFFFFF">prediction = nonlinear backbone + Linear(history inflow)</text><text x="640" y="182" text-anchor="middle" font-size="16" fill="#C9D5DF">Each node's past 48 inflow values map directly to 48 future steps; the backbone learns the remaining nonlinear correction.</text></g>
 <g id="chart"><rect x="55" y="225" width="740" height="340" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/fig4_1_linear_horizon.png" x="75" y="245" width="700" height="300" preserveAspectRatio="xMidYMid meet"/></g>
 <g id="evidence" font-family="Arial, Microsoft YaHei, sans-serif">
  <rect x="825" y="225" width="400" height="105" fill="#FFFFFF" stroke="#C9D5DF"/><text x="850" y="260" font-size="22" font-weight="700" fill="#103B5C">Discovered in Spacetimeformer</text><text x="850" y="294" font-size="30" font-weight="700" fill="#F26A2E">18.2950 → 17.0688</text><text x="850" y="318" font-size="16" fill="#526372">avg MAE, about 6.70% lower</text>
  <rect x="825" y="345" width="400" height="105" fill="#FFFFFF" stroke="#F26A2E" stroke-width="2"/><text x="850" y="380" font-size="22" font-weight="700" fill="#103B5C">Transferred to AGFormer</text><text x="850" y="414" font-size="30" font-weight="700" fill="#F26A2E">16.5350 → 16.1132</text><text x="850" y="438" font-size="16" fill="#526372">same seed42, 2.55% lower</text>
  <rect x="825" y="465" width="400" height="100" fill="#EAF0F5"/><text x="850" y="500" font-size="22" font-weight="700" fill="#103B5C">Why did RMSE not improve?</text><text x="850" y="528" font-size="16" fill="#526372">Lower average bias can still smooth peaks.</text><text x="850" y="556" font-size="16" fill="#C97A11">RMSE 30.1288 → 30.3198, up 0.19.</text>
 </g>
 <g id="lesson" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="592" width="1170" height="62" fill="#EAF0F5"/><text x="78" y="619" font-size="18" font-weight="700" fill="#103B5C">Mechanism</text><text x="220" y="619" font-size="16" fill="#17212B">Urban flow has strong autoregressive inertia; the linear branch handles it directly.</text><text x="220" y="643" font-size="16" fill="#526372">The nonlinear backbone can then focus on residual structure.</text></g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="690" font-size="16" fill="#526372">The module was then tested across four seeds to avoid mistaking a seed42 accident for structural value.</text></g>
</svg>
