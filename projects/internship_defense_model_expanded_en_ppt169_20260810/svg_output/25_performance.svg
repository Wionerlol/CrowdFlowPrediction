<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g><g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="78" font-size="56" font-weight="700" fill="#103B5C">System Performance: Faster, Leaner, Numerically Consistent</text><text x="1165" y="64" font-size="16" fill="#526372">25</text></g><g id="charts"><rect x="55" y="112" width="670" height="350" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/pipeline_time_memory.png" x="75" y="132" width="630" height="310" preserveAspectRatio="xMidYMid meet"/><rect x="755" y="112" width="470" height="350" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/api_speedup.png" x="775" y="132" width="430" height="310" preserveAspectRatio="xMidYMid meet"/></g><g id="kpis" font-family="Arial, Microsoft YaHei, sans-serif"><text x="65" y="520" font-size="64" font-weight="700" fill="#F26A2E">1.39×</text><text x="65" y="558" font-size="18" fill="#526372">warm FP32: 6.416s → 4.613s</text><text x="375" y="520" font-size="64" font-weight="700" fill="#103B5C">−53.9%</text><text x="375" y="558" font-size="18" fill="#526372">process-tree RSS</text><text x="700" y="520" font-size="64" font-weight="700" fill="#2A7F9E">0.038s</text><text x="700" y="558" font-size="18" fill="#526372">stats cache, from 1.723s</text><text x="1010" y="520" font-size="64" font-weight="700" fill="#C97A11">0.9945×</text><text x="1010" y="558" font-size="18" fill="#526372">FP16 speed ratio</text></g><g id="decision" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="605" width="1170" height="72" fill="#103B5C"/><use data-icon="tabler-outline/check" x="78" y="620" width="42" height="42" stroke="#2E7D5B" stroke-width="2" fill="none"/><text x="140" y="635" font-size="18" font-weight="700" fill="#FFFFFF">DEPLOYMENT DECISION: KEEP OPTIMIZED FP32</text><text x="140" y="664" font-size="18" fill="#C9D5DF">Shared full-sequence inference and batch=8 accelerate; FP16 saves memory but misses the speed gate.</text></g></svg>
