<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#C9D5DF"/></marker></defs>
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="76" font-size="38" font-weight="700" fill="#103B5C">Final AGFormer: Evidence-Based Module Composition</text><text x="1200" y="64" font-size="16" fill="#526372">16</text></g>
 <g id="layers" font-family="Arial, Microsoft YaHei, sans-serif">
  <g id="input"><rect x="60" y="108" width="1160" height="88" fill="#EAF0F5"/><text x="82" y="143" font-size="28" font-weight="700" fill="#103B5C">Input</text><text x="220" y="143" font-size="26" fill="#17212B">48-step inflow / outflow</text><text x="595" y="143" font-size="26" fill="#17212B">7 time/calendar features</text><text x="930" y="143" font-size="26" fill="#17212B">33 static features</text><text x="82" y="178" font-size="16" fill="#526372">Aligned node indices, true timestamps and gap-aware continuous windows</text></g>
  <path d="M640 196V222" stroke="#C9D5DF" stroke-width="4" marker-end="url(#a)"/>
  <g id="gate"><rect x="155" y="228" width="970" height="72" fill="#2A7F9E"/><text x="185" y="273" font-size="28" font-weight="700" fill="#FFFFFF">Context gate</text><text x="410" y="273" font-size="22" fill="#FFFFFF">Scale time and static signals conditional on flow</text></g>
  <path d="M640 300V328" stroke="#C9D5DF" stroke-width="4" marker-end="url(#a)"/>
  <g id="model"><rect x="60" y="334" width="365" height="150" fill="#FFFFFF" stroke="#103B5C" stroke-width="3"/><text x="85" y="375" font-size="28" font-weight="700" fill="#103B5C">Temporal path</text><text x="85" y="414" font-size="24" fill="#17212B">2 layers · 4 heads · d=32</text><text x="85" y="447" font-size="18" fill="#526372">Transformer self-attention</text><text x="85" y="473" font-size="16" fill="#2A7F9E">Source: Vaswani et al.</text>
  <rect x="455" y="334" width="365" height="150" fill="#FFFFFF" stroke="#2A7F9E" stroke-width="3"/><text x="480" y="375" font-size="28" font-weight="700" fill="#103B5C">Explicit spatial path</text><text x="480" y="414" font-size="24" fill="#17212B">spatial graph GCN</text><text x="480" y="447" font-size="18" fill="#526372">Stable neighbor propagation</text><text x="480" y="473" font-size="16" fill="#2A7F9E">Source: STGCN lineage</text>
  <rect x="850" y="334" width="370" height="150" fill="#FFFFFF" stroke="#F26A2E" stroke-width="3"/><text x="875" y="375" font-size="28" font-weight="700" fill="#103B5C">Adaptive spatial path</text><text x="875" y="414" font-size="24" fill="#17212B">node-embedding adjacency</text><text x="875" y="447" font-size="18" fill="#526372">Data-driven non-local links</text><text x="875" y="473" font-size="16" fill="#F26A2E">Source: Graph WaveNet idea</text></g>
  <path d="M242 484V514M638 484V514M1035 484V514" stroke="#C9D5DF" stroke-width="4" marker-end="url(#a)"/>
  <g id="output"><rect x="60" y="520" width="1160" height="115" fill="#103B5C"/><text x="85" y="558" font-size="28" font-weight="700" fill="#FFFFFF">Output</text><text x="260" y="558" font-size="26" fill="#FFFFFF">nonlinear AGFormer + Linear(history inflow)</text><text x="85" y="590" font-size="16" fill="#C9D5DF">The linear residual came from the useful part of the failed Spacetimeformer branch;</text><text x="85" y="614" font-size="16" fill="#C9D5DF">four seed predictions are then averaged.</text><text x="715" y="614" font-size="16" fill="#F26A2E">0.052M per model · real-time fallback: seed42</text></g>
 </g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="683" font-size="16" fill="#526372">AGFormer is a project-specific implementation, not a claimed reproduction of an external same-name paper.</text></g>
</svg>
