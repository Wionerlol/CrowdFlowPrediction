<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g><g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="78" font-size="56" font-weight="700" fill="#103B5C">Attention, TreeSHAP and External Context Evidence</text><text x="1165" y="64" font-size="16" fill="#526372">24</text></g><g id="attention"><rect x="55" y="115" width="610" height="320" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/attention_temporal_heatmap.png" x="75" y="135" width="570" height="280" preserveAspectRatio="xMidYMid meet"/></g><g id="shap"><rect x="695" y="115" width="530" height="320" fill="#FFFFFF" stroke="#C9D5DF"/><image href="../images/shap_group_importance.png" x="715" y="135" width="490" height="280" preserveAspectRatio="xMidYMid meet"/></g><g id="evidence" font-family="Arial, Microsoft YaHei, sans-serif"><text x="60" y="485" font-size="34" font-weight="700" fill="#103B5C">Attention entropy: 0.9956</text><text x="60" y="528" font-size="18" fill="#526372"><tspan x="60">Aggregated attention does not collapse</tspan><tspan x="60" dy="30">onto a small set of lags.</tspan></text><text x="695" y="485" font-size="34" font-weight="700" fill="#103B5C">TreeSHAP surrogate R²: 0.9926</text><text x="695" y="528" font-size="18" fill="#526372"><tspan x="695">Flow history contributes 97.43%;</tspan><tspan x="695" dy="30">calendar context contributes 2.33%.</tspan></text></g><g id="context" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="600" width="1170" height="78" fill="#EAF0F5"/><text x="78" y="630" font-size="18" font-weight="700" fill="#103B5C">ANOMALY CONTEXT</text><text x="255" y="630" font-size="18" fill="#526372">82 of 131 events match weather/calendar candidates; 49 have no external match.</text><text x="78" y="660" font-size="18" fill="#C97A11">Attention, SHAP and context associations explain contribution—not causation.</text></g></svg>
