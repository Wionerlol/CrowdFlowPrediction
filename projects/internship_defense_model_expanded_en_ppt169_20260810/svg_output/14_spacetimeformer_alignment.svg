<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="76" font-size="42" font-weight="700" fill="#103B5C">Spacetimeformer: Five-Step Paper Alignment</text><text x="1165" y="64" font-size="16" fill="#526372">14</text></g>
 <g id="paper" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="55" y="110" width="470" height="515" fill="#FFFFFF" stroke="#C9D5DF"/><text x="78" y="150" font-size="28" font-weight="700" fill="#103B5C">Paper: variable × time tokens</text><image href="../images/paper_figures/spacetimeformer_fig3_architecture.png" x="105" y="165" width="370" height="410" preserveAspectRatio="xMidYMid meet"/><text x="78" y="605" font-size="16" fill="#526372">Grigsby et al., arXiv:2109.12218, Fig. 3</text></g>
 <g id="steps" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="555" y="110" width="670" height="515" fill="#FFFFFF" stroke="#C9D5DF"/><text x="585" y="150" font-size="28" font-weight="700" fill="#103B5C">Implementation alignment sequence</text>
  <line x1="625" y1="190" x2="625" y2="535" stroke="#C9D5DF" stroke-width="4"/>
  <g><circle cx="625" cy="205" r="20" fill="#2A7F9E"/><text x="625" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text><text x="665" y="200" font-size="22" font-weight="700" fill="#17212B">Fix input facts first</text><text x="665" y="227" font-size="18" fill="#526372">True timestamps, 33 static features, gap-aware windows</text></g>
  <g><circle cx="625" cy="285" r="20" fill="#2A7F9E"/><text x="625" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text><text x="665" y="280" font-size="22" font-weight="700" fill="#17212B">Match AGFormer capacity</text><text x="665" y="307" font-size="18" fill="#526372">d=32, four heads, two layers; 0.030M → 0.082M</text></g>
  <g><circle cx="625" cy="365" r="20" fill="#2A7F9E"/><text x="625" y="372" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text><text x="665" y="360" font-size="22" font-weight="700" fill="#17212B">Align attention structure</text><text x="665" y="387" font-size="18" fill="#526372">Local temporal attention + linear global attention</text></g>
  <g><circle cx="625" cy="445" r="20" fill="#F26A2E"/><text x="625" y="452" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text><text x="665" y="440" font-size="22" font-weight="700" fill="#17212B">Align embeddings</text><text x="665" y="467" font-size="18" fill="#526372">Separate value/time, given/missing, context/target tokens</text></g>
  <g><circle cx="625" cy="525" r="20" fill="#F26A2E"/><text x="625" y="532" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">5</text><text x="665" y="520" font-size="22" font-weight="700" fill="#17212B">Complete encoder-decoder</text><text x="665" y="547" font-size="18" fill="#526372">Local/global cross-attention; full aligned model ≈ 0.089M</text></g>
  <rect x="585" y="570" width="610" height="40" fill="#EAF0F5"/><text x="890" y="596" text-anchor="middle" font-size="18" fill="#103B5C">Context tokens: 1,024 × 48 = 49,152; standard global attention is impractical.</text>
 </g>
 <g id="footer" font-family="Arial, Microsoft YaHei, sans-serif"><text x="55" y="683" font-size="16" fill="#526372">The goal was to test the architectural hypothesis, not claim a 100% reproduction of every training detail.</text></g>
</svg>
