  <g><circle cx="385" cy="535" r="24" fill="#F26A2E"/><text x="385" y="543" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text><text x="425" y="528" font-size="18" font-weight="700" fill="#17212B">日历修复重跑</text><text x="425" y="558" font-size="18" fill="#526372">排除错误编码的虚假提升</text></g>
  <g><circle cx="690" cy="535" r="24" fill="#103B5C"/><text x="690" y="543" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text><text x="730" y="528" font-size="18" font-weight="700" fill="#17212B">同窗口对照</text><text x="730" y="558" font-size="18" fill="#526372">周期滞后：3,433 个窗口</text></g>
