<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="76" font-size="50" font-weight="700" fill="#103B5C">两个负结果：简单多图融合与周期滞后都没有兑现预期</text><text x="1165" y="64" font-size="16" fill="#526372">18</text></g>
 <g id="multigraph" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="55" y="112" width="555" height="440" fill="#FFFFFF" stroke="#C9D5DF"/><text x="80" y="152" font-size="28" font-weight="700" fill="#103B5C">A · 多图 AGFormer</text><image href="../images/fig3_4_multigraph_weights.png" x="80" y="170" width="505" height="245" preserveAspectRatio="xMidYMid meet"/><text x="80" y="446" font-size="18" fill="#17212B">flow 92.18% · spatial 7.37%</text><text x="80" y="474" font-size="18" fill="#526372">POI 0.42% · transit 0.02%</text><text x="80" y="509" font-size="18" fill="#C97A11">全局 softmax 让权重塌缩到 flow graph，</text><text x="80" y="535" font-size="18" fill="#C97A11">无法表达“某节点/时段更依赖道路或交通”。</text></g>
 <g id="lags" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="640" y="112" width="585" height="440" fill="#FFFFFF" stroke="#C9D5DF"/><text x="665" y="152" font-size="28" font-weight="700" fill="#103B5C">B · lag_48 / lag_336 与差值</text><text x="665" y="188" font-size="18" fill="#526372">严格使用相同 3,433 个测试窗口</text>
  <line x1="795" y1="245" x2="1165" y2="245" stroke="#DDE5EC"/><line x1="795" y1="245" x2="795" y2="375" stroke="#C9D5DF"/>
  <text x="665" y="287" font-size="18" fill="#17212B">同窗原基线</text><rect x="795" y="262" width="292" height="38" fill="#2A7F9E"/><text x="1100" y="288" font-size="18" font-weight="700" fill="#103B5C">16.2443</text>
  <text x="665" y="353" font-size="18" fill="#17212B">周期滞后</text><rect x="795" y="328" width="323" height="38" fill="#F26A2E"/><text x="1132" y="354" font-size="18" font-weight="700" fill="#103B5C">17.9614</text>
  <text x="665" y="402" font-size="16" fill="#526372">avg MAE，越低越好</text><text x="665" y="445" font-size="18" fill="#526372">lag_48 与 48 步历史中的日内惯性部分重复；</text><text x="665" y="475" font-size="18" fill="#526372">lag_336 遇到节假日、缺口时更容易失配；</text><text x="665" y="505" font-size="18" fill="#C97A11">差值特征还会放大不规则波动。</text></g>
 <g id="decision" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="55" y="580" width="1170" height="72" fill="#103B5C"/><text x="80" y="611" font-size="22" font-weight="700" fill="#FFFFFF">下一版方向</text><text x="250" y="611" font-size="18" fill="#EAF0F5">多图改为 node/head/layer 级动态路由；周期性改用可学习 seasonal branch，而不是直接拼接滞后值。</text><text x="80" y="638" font-size="16" fill="#F26A2E">本次答辩不把这些未验证方向包装成已完成增益。</text></g>
 <g id="footer" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="690" font-size="16" fill="#526372">Multi-graph avg MAE 16.9569，也未超过单图 gated 16.5350。</text></g>
</svg>
