<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#C9D5DF"/></marker></defs>
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="76" font-size="50" font-weight="700" fill="#103B5C">最终 AGFormer：经消融重新组合的三类机制</text><text x="1165" y="64" font-size="16" fill="#526372">16</text></g>
 <g id="layers" font-family="Microsoft YaHei, Arial, sans-serif">
  <g id="input"><rect x="60" y="108" width="1160" height="88" fill="#EAF0F5"/><text x="82" y="143" font-size="28" font-weight="700" fill="#103B5C">输入</text><text x="230" y="143" font-size="26" fill="#17212B">48 步 inflow / outflow</text><text x="600" y="143" font-size="26" fill="#17212B">7 维时间日历</text><text x="905" y="143" font-size="26" fill="#17212B">33 维静态节点</text><text x="82" y="178" font-size="16" fill="#526372">同一节点索引、真实时间戳、gap-aware 连续窗口</text></g>
  <path d="M640 196V222" stroke="#C9D5DF" stroke-width="4" marker-end="url(#a)"/>
  <g id="gate"><rect x="155" y="228" width="970" height="72" fill="#2A7F9E"/><text x="185" y="273" font-size="28" font-weight="700" fill="#FFFFFF">门控上下文</text><text x="410" y="273" font-size="24" fill="#FFFFFF">根据流量状态动态缩放 time / static 贡献</text><text x="1045" y="273" text-anchor="end" font-size="16" fill="#EAF0F5">项目消融保留</text></g>
  <path d="M640 300V328" stroke="#C9D5DF" stroke-width="4" marker-end="url(#a)"/>
  <g id="model"><rect x="60" y="334" width="365" height="150" fill="#FFFFFF" stroke="#103B5C" stroke-width="3"/><text x="85" y="375" font-size="28" font-weight="700" fill="#103B5C">时间路径</text><text x="85" y="414" font-size="24" fill="#17212B">2 层 · 4 头 · d=32</text><text x="85" y="447" font-size="18" fill="#526372">Transformer self-attention</text><text x="85" y="473" font-size="16" fill="#2A7F9E">来源：Vaswani et al.</text>
  <rect x="455" y="334" width="365" height="150" fill="#FFFFFF" stroke="#2A7F9E" stroke-width="3"/><text x="480" y="375" font-size="28" font-weight="700" fill="#103B5C">显式空间路径</text><text x="480" y="414" font-size="24" fill="#17212B">spatial graph GCN</text><text x="480" y="447" font-size="18" fill="#526372">稳定传播相邻网格信息</text><text x="480" y="473" font-size="16" fill="#2A7F9E">来源：STGCN</text>
  <rect x="850" y="334" width="370" height="150" fill="#FFFFFF" stroke="#F26A2E" stroke-width="3"/><text x="875" y="375" font-size="28" font-weight="700" fill="#103B5C">自适应空间路径</text><text x="875" y="414" font-size="24" fill="#17212B">node-embedding adjacency</text><text x="875" y="447" font-size="18" fill="#526372">学习非局部、数据驱动关系</text><text x="875" y="473" font-size="16" fill="#F26A2E">来源：Graph WaveNet 思想</text></g>
  <path d="M242 484V514M638 484V514M1035 484V514" stroke="#C9D5DF" stroke-width="4" marker-end="url(#a)"/>
  <g id="output"><rect x="60" y="520" width="1160" height="115" fill="#103B5C"/><text x="85" y="558" font-size="28" font-weight="700" fill="#FFFFFF">预测输出</text><text x="270" y="558" font-size="26" fill="#FFFFFF">nonlinear AGFormer + Linear(history inflow)</text><text x="85" y="594" font-size="18" fill="#C9D5DF">线性残差头来自 Spacetimeformer 负结果中的有效模块迁移；4 个随机种子的预测再做均值 ensemble。</text><text x="85" y="621" font-size="16" fill="#F26A2E">单模型 0.052M 参数；主离线方案 4 × 0.052M，实时降级方案只执行 seed42。</text></g>
 </g>
 <g id="footer" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="683" font-size="16" fill="#526372">AGFormer 为项目自主组合实现，不宣称复现同名论文。</text></g>
</svg>
