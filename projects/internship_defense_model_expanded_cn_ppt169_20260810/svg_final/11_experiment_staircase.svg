<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#C9D5DF"/></marker></defs>
 <g id="background"><rect width="1280" height="720" fill="#F7FAFC"/></g>
 <g id="header" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="76" font-size="52" font-weight="700" fill="#103B5C">实验不是跳到最优，而是沿五级证据链收敛</text><text x="1165" y="64" font-size="16" fill="#526372">11</text><text x="55" y="120" font-size="18" fill="#526372">统一 gap-aware 数据规则后，依次回答“空间是否有用、上下文如何进入、线性趋势是否应单独建模、随机性如何处理”。</text></g>
 <g id="flow" font-family="Microsoft YaHei, Arial, sans-serif">
  <path d="M257 325H293M489 325H525M721 325H757M953 325H989" stroke="#C9D5DF" stroke-width="5" marker-end="url(#arrow)"/>
  <g id="s1"><rect x="55" y="175" width="200" height="300" fill="#FFFFFF" stroke="#C9D5DF"/><text x="75" y="212" font-size="18" font-weight="700" fill="#526372">01 · 时序基线</text><text x="75" y="258" font-size="30" font-weight="700" fill="#103B5C">LSTM</text><text x="75" y="325" font-size="48" font-weight="700" fill="#17212B">19.4941</text><text x="75" y="355" font-size="16" fill="#526372">avg MAE · 3 seed</text><line x1="75" y1="382" x2="235" y2="382" stroke="#DDE5EC"/><text x="75" y="415" font-size="18" fill="#526372">结论：48 步历史有效，</text><text x="75" y="443" font-size="18" fill="#526372">但无空间传播。</text></g>
  <g id="s2"><rect x="287" y="175" width="200" height="300" fill="#FFFFFF" stroke="#2A7F9E" stroke-width="2"/><text x="307" y="212" font-size="18" font-weight="700" fill="#526372">02 · 加空间先验</text><text x="307" y="250" font-size="26" font-weight="700" fill="#103B5C">AGFormer</text><text x="307" y="280" font-size="18" fill="#526372">Time + Static</text><text x="307" y="325" font-size="48" font-weight="700" fill="#2A7F9E">16.9376</text><text x="307" y="355" font-size="16" fill="#526372">avg MAE · 3 seed</text><line x1="307" y1="382" x2="467" y2="382" stroke="#DDE5EC"/><text x="307" y="415" font-size="18" fill="#526372">显式图 + 自适应图</text><text x="307" y="443" font-size="18" fill="#526372">明显优于纯时序。</text></g>
  <g id="s3"><rect x="519" y="175" width="200" height="300" fill="#FFFFFF" stroke="#2A7F9E" stroke-width="2"/><text x="539" y="212" font-size="18" font-weight="700" fill="#526372">03 · 上下文门控</text><text x="539" y="258" font-size="28" font-weight="700" fill="#103B5C">Gated</text><text x="539" y="325" font-size="48" font-weight="700" fill="#2A7F9E">16.5350</text><text x="539" y="355" font-size="16" fill="#526372">avg MAE · seed42</text><line x1="539" y1="382" x2="699" y2="382" stroke="#DDE5EC"/><text x="539" y="415" font-size="18" fill="#526372">按流量状态调节</text><text x="539" y="443" font-size="18" fill="#526372">时间与静态贡献。</text></g>
  <g id="s4"><rect x="751" y="175" width="200" height="300" fill="#FFFFFF" stroke="#F26A2E" stroke-width="3"/><text x="771" y="212" font-size="18" font-weight="700" fill="#526372">04 · 线性残差</text><text x="771" y="250" font-size="27" font-weight="700" fill="#103B5C">Gated + Linear</text><text x="771" y="325" font-size="48" font-weight="700" fill="#F26A2E">16.1132</text><text x="771" y="355" font-size="16" fill="#526372">avg MAE · seed42</text><line x1="771" y1="382" x2="931" y2="382" stroke="#DDE5EC"/><text x="771" y="415" font-size="18" fill="#526372">线性头守惯性，</text><text x="771" y="443" font-size="18" fill="#526372">主干学非线性残差。</text></g>
  <g id="s5"><rect x="983" y="175" width="242" height="300" fill="#103B5C"/><text x="1005" y="212" font-size="18" font-weight="700" fill="#C9D5DF">05 · 降低随机方差</text><text x="1005" y="250" font-size="27" font-weight="700" fill="#FFFFFF">4-seed Ensemble</text><text x="1005" y="325" font-size="52" font-weight="700" fill="#F26A2E">15.9030</text><text x="1005" y="355" font-size="16" fill="#FFFFFF">avg MAE · 4,022 windows</text><line x1="1005" y1="382" x2="1200" y2="382" stroke="#2A7F9E"/><text x="1005" y="415" font-size="18" fill="#EAF0F5">预测均值进一步降低</text><text x="1005" y="443" font-size="18" fill="#EAF0F5">MAE 与 MAPE。</text></g>
 </g>
 <g id="notes" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="55" y="515" width="1170" height="115" fill="#EAF0F5"/><text x="78" y="552" font-size="22" font-weight="700" fill="#103B5C">读图方法</text><text x="78" y="586" font-size="18" fill="#526372">前两项是 3-seed 指标均值，后两项为 seed42 单模型，最后一项为逐样本 ensemble；因此用于展示研发路径，不冒充严格配对显著性检验。</text><text x="78" y="615" font-size="18" fill="#526372">严格判断增益时，后续页面使用相同 seed、相同窗口或独立多 seed 复验。</text></g>
 <g id="footer" font-family="Microsoft YaHei, Arial, sans-serif"><text x="55" y="683" font-size="16" fill="#526372">核心结果：相对原 gated 基线，最终 ensemble 的 MAE 降低 3.82%。</text></g>
</svg>
